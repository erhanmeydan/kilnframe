<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>s1</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Archivo";
          font-weight: 100 900;
          font-stretch: 62% 125%;
          src: url("vendor/fonts/archivo/Archivo-Variable.ttf") format("truetype");
        }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s1-bg {
          position: absolute;
          inset: 0;
          background: #1c1c1c;
        }
        /* One family; width is the design variable (tokens.widths): 125 for the hero, 62 for the rest. */
        .s1-type {
          font-family: "Archivo", sans-serif;
          font-variation-settings:
            "wght" 900,
            "wdth" var(--wdth);
          line-height: 0.82;
          text-transform: uppercase;
          white-space: nowrap;
          color: #ede6d8;
        }
        /* Each word rises from or slides through its own mask, so the edges stay clean. */
        .s1-mask {
          position: absolute;
          overflow: hidden;
        }
        #s1-hero-mask {
          left: 0;
          right: 0;
          top: 0;
          height: 790px;
        }
        #s1-hero {
          --wdth: 62;
          position: absolute;
          left: 50%;
          bottom: 20px;
          font-size: 860px;
          transform-origin: center bottom;
        }
        /* The mask reaches well above the cap height: Ö, Ü, İ marks sit above the line box. */
        #s1-row-mask {
          left: 0;
          right: 0;
          top: 700px;
          height: 380px;
        }
        .s1-small {
          --wdth: 62;
          position: absolute;
          bottom: 38px;
          font-size: 302px;
        }
        #s1-w1 {
          left: 36px;
        }
        #s1-w2 {
          right: 36px;
        }
        #s1-wave {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          mix-blend-mode: difference;
        }
        #s1-grain {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          opacity: 0.04;
        }
      </style>
      <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
        <div id="s1-bg"></div>
        <div id="s1-hero-mask" class="s1-mask">
          <div id="s1-hero" class="s1-type" data-layout-allow-overflow data-layout-allow-occlusion>
            Ses
          </div>
        </div>
        <svg id="s1-wave" viewBox="0 0 1920 1080">
          <path id="s1-wave-path" d="" fill="none" stroke="#ede6d8" stroke-width="5" />
        </svg>
        <div id="s1-row-mask" class="s1-mask">
          <div id="s1-w1" class="s1-type s1-small" data-layout-allow-occlusion>Görüntü</div>
          <div id="s1-w2" class="s1-type s1-small" data-layout-allow-occlusion>olsun</div>
        </div>
        <canvas id="s1-grain" width="1920" height="1080"></canvas>
      </div>
      <script>
        (function () {
          const DURATION = 5;
          const PAL = { bg: "#1C1C1C", type: "#EDE6D8", accent: "#E0633A" };

          function mulberry(seed) {
            return function () {
              seed |= 0;
              seed = (seed + 0x6d2b79f5) | 0;
              let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          // Static fine grain (tokens.surface.grain, seed 5): drawn once, never animated.
          {
            const g = document.getElementById("s1-grain").getContext("2d");
            const img = g.createImageData(1920, 1080);
            const rnd = mulberry(5);
            for (let i = 0; i < img.data.length; i += 4) {
              const v = rnd() < 0.5 ? 0 : 255;
              img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
              img.data[i + 3] = 255;
            }
            g.putImageData(img, 0, 0);
          }

          // Thin waveform through the hero word: a few seeded bursts on a flat line. The difference
          // blend makes it light over the background and dark over the letters, like the still.
          const WAVE_Y = 470;
          const rnd = mulberry(23);
          const bursts = [0.08, 0.27, 0.43, 0.66, 0.88].map((x) => ({
            x: x * 1920,
            w: 60 + rnd() * 70,
            a: 34 + rnd() * 90,
          }));
          const path = document.getElementById("s1-wave-path");
          const wave = { _t: -1 };
          Object.defineProperty(wave, "t", {
            get() {
              return this._t;
            },
            set(t) {
              if (t === this._t) return;
              this._t = t;
              // drawn from the left edge between 1.0 s and 1.6 s, then the bursts keep breathing
              const reach = 1920 * Math.min(1, Math.max(0, (t - 1.0) / 0.6));
              const pts = [];
              for (let x = 0; x <= reach; x += 3) {
                let env = 0.04;
                for (const b of bursts) env += Math.exp(-(((x - b.x) / b.w) ** 2)) * b.a;
                const breathe = 0.75 + 0.25 * Math.sin(t * 5.2 + x * 0.004);
                const y = WAVE_Y + env * breathe * Math.sin(x * 0.19 - t * 9);
                pts.push(`${x === 0 ? "M" : "L"}${x.toFixed(1)} ${y.toFixed(1)}`);
              }
              path.setAttribute("d", pts.join(" "));
            },
          });

          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady["s1"] = document.fonts.load('900 302px "Archivo"').then(() => {
            const tl = gsap.timeline({ paused: true });
            tl.fromTo(wave, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none" }, 0);

            // "SES" rises from its mask line, then stretches from condensed to extended on its stress.
            tl.fromTo(
              "#s1-hero",
              { xPercent: -50, yPercent: 100 },
              { xPercent: -50, yPercent: 0, duration: 0.45, ease: "expo.out" },
              0.12,
            );
            tl.to("#s1-hero", { "--wdth": 125, duration: 0.6, ease: "power3.inOut" }, 0.5);

            // "GÖRÜNTÜ" slides in from the left edge, "OLSUN" from the right, each on its word.
            tl.fromTo(
              "#s1-w1",
              { xPercent: -115 },
              { xPercent: 0, duration: 0.45, ease: "expo.out" },
              1.75,
            );
            tl.fromTo(
              "#s1-w2",
              { xPercent: 115 },
              { xPercent: 0, duration: 0.45, ease: "expo.out" },
              2.3,
            );
            // the stressed word turns orange on the beat, a hard switch with no fade
            tl.set("#s1-w1", { color: PAL.accent }, 2.75);

            wave.t = 0;
            window.__timelines["s1"] = tl;
            return true;
          });
        })();
      </script>
    </template>
  </body>
</html>
