      <script>
        (function () {
          const DURATION = 5;

          // Ribbon: a thick paper band along a cubic centerline with horizontal tangents (an S curve).
          // The far end sways a little with time, seeded per ribbon (tokens.motion.sway).
          const RIBBONS = [
            { id: "s1-ribbon-1", from: [1050, 352], to: [1600, 232], w: 72, phase: 0.4 },
            { id: "s1-ribbon-2", from: [1060, 420], to: [1600, 488], w: 72, phase: 2.1 },
            { id: "s1-ribbon-3", from: [1060, 488], to: [1600, 780], w: 72, phase: 3.7 },
          ];
          function ribbonPath(r, t) {
            const [x0, y0] = r.from;
            const [x3, y3] = r.to;
            const c1 = [x0 + 260, y0];
            const c2 = [x3 - 300, y3];
            const top = [];
            const bottom = [];
            const N = 48;
            for (let i = 0; i <= N; i++) {
              const u = i / N;
              const a = (1 - u) ** 3;
              const b = 3 * (1 - u) ** 2 * u;
              const c = 3 * (1 - u) * u * u;
              const d = u ** 3;
              const x = a * x0 + b * c1[0] + c * c2[0] + d * x3;
              const sway = Math.sin(t * 1.7 + r.phase + u * 3) * 5 * Math.sin(Math.PI * u);
              const y = a * y0 + b * c1[1] + c * c2[1] + d * y3 + sway;
              // tangent for the band's normal
              const dx =
                3 *
                ((1 - u) ** 2 * (c1[0] - x0) +
                  2 * (1 - u) * u * (c2[0] - c1[0]) +
                  u * u * (x3 - c2[0]));
              const dy =
                3 *
                ((1 - u) ** 2 * (c1[1] - y0) +
                  2 * (1 - u) * u * (c2[1] - c1[1]) +
                  u * u * (y3 - c2[1]));
              const len = Math.hypot(dx, dy) || 1;
              const nx = -dy / len;
              const ny = dx / len;
              top.push([x + (nx * r.w) / 2, y + (ny * r.w) / 2]);
              bottom.push([x - (nx * r.w) / 2, y - (ny * r.w) / 2]);
            }
            const pts = top.concat(bottom.reverse());
            return "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + " Z";
          }
          const ribbonEls = RIBBONS.map((r) => document.getElementById(r.id));
          const liftShadow = document.getElementById("s1-lift-shadow");

          // Ribbons sway and the sun lifts, both drawn from time through a driver setter.
          const LIFT = { t0: 3.3, up: 0.35, hold: 0.4, down: 0.45 };
          const driver = { _t: -1 };
          Object.defineProperty(driver, "t", {
            get() {
              return this._t;
            },
            set(t) {
              if (t === this._t) return;
              this._t = t;
              RIBBONS.forEach((r, i) => ribbonEls[i].setAttribute("d", ribbonPath(r, t)));
              const k = Math.max(
                0,
                Math.min(
                  (t - LIFT.t0) / LIFT.up,
                  1,
                  (LIFT.t0 + LIFT.up + LIFT.hold + LIFT.down - t) / LIFT.down,
                ),
              );
              const e = k * k * (3 - 2 * k);
              liftShadow.setAttribute("dy", (3 + 7 * e).toFixed(2));
              liftShadow.setAttribute("stdDeviation", (3 + 6 * e).toFixed(2));
              liftShadow.setAttribute("flood-opacity", (0.28 - 0.08 * e).toFixed(3));
            },
          });

          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady["s1"] = document.fonts.load('900 104px "Nunito"').then(() => {
            const tl = gsap.timeline({ paused: true });
            const ENTER = { duration: 0.55, ease: "back.out(1.3)" };
            tl.fromTo(driver, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none" }, 0);

            // headline words slide in as paper layers
            tl.fromTo(".s1-word", { x: -760 }, { x: 0, stagger: 0.12, ...ENTER }, 0.15);

            // microphone assembled back to front, one layer at a time from below the frame
            const micLayers = [
              "#s1-stem",
              "#s1-base",
              "#s1-collar",
              "#s1-inner",
              "#s1-cap-top",
              "#s1-cap-bottom",
              "#s1-holder",
              ".s1-knob",
            ];
            micLayers.forEach((sel, i) => {
              tl.fromTo(sel, { y: 820 }, { y: 0, ...ENTER }, 0.35 + i * 0.07);
            });

            // frames slide in from the right edge, then the ribbons unroll from the microphone to them
            tl.fromTo(".s1-frame", { x: 420 }, { x: 0, stagger: 0.12, ...ENTER }, 1.0);
            tl.fromTo(
              "#s1-ribbon-reveal",
              { attr: { width: 0 } },
              { attr: { width: 640 }, duration: 0.9, ease: "power2.inOut" },
              1.45,
            );

            // the pictures inside flip up from behind the frame windows
            tl.fromTo(
              ".s1-pic",
              { scaleY: 0, transformOrigin: "50% 100%" },
              { scaleY: 1, stagger: 0.18, ...ENTER },
              2.2,
            );

            driver.t = 0;
            window.__timelines["s1"] = tl;
            return true;
          });
        })();
      </script>
