<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>s1</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Archivo";
          font-weight: 100 900;
          src: url("vendor/fonts/archivo/Archivo-Variable.ttf") format("truetype");
        }
        @font-face {
          font-family: "Anton";
          font-weight: 400;
          src: url("vendor/fonts/anton/Anton-Regular.ttf") format("truetype");
        }
        @font-face {
          font-family: "Alfa Slab One";
          font-weight: 400;
          src: url("vendor/fonts/alfa-slab-one/AlfaSlabOne-Regular.ttf") format("truetype");
        }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s1-bg {
          position: absolute;
          inset: 0;
          background: #e9e4d8;
        }
        #s1-grain,
        #s1-page {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        #s1-grain {
          opacity: 0.04;
        }
      </style>
      <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
        <div id="s1-bg"></div>
        <canvas id="s1-grain" width="1920" height="1080"></canvas>
        <canvas id="s1-page" width="1920" height="1080"></canvas>
      </div>
      <script>
        (function () {
          // ---------- style tokens (styles/kolaj-halftone/tokens.json) ----------
          const C = {
            red: "#B5463A",
            blue: "#5E7A93",
            ink: "#151515",
            paperLight: "#F1ECE0",
            rim: "#F6F2E8",
            tape: "rgba(240,236,224,0.6)",
          };
          const DOT = { spacing: 13, radius: 4.1, angle: Math.PI / 4 };
          const W = 1920;
          const H = 1080;
          const DURATION = 5;

          const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
          const power4Out = (p) => 1 - Math.pow(1 - p, 5);

          function mulberry(seed) {
            return function () {
              seed |= 0;
              seed = (seed + 0x6d2b79f5) | 0;
              let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          // Page grain, drawn once (tokens.paper.grain, seed 8).
          {
            const g = document.getElementById("s1-grain").getContext("2d");
            const img = g.createImageData(W, H);
            const rnd = mulberry(8);
            for (let i = 0; i < img.data.length; i += 4) {
              const v = Math.floor(rnd() * 255);
              img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
              img.data[i + 3] = 255;
            }
            g.putImageData(img, 0, 0);
          }

          // ---------- torn paper pieces, each pre-rendered once into its own canvas ----------
          const tornRnd = mulberry(13);
          // Outline of a w x h rectangle with a rough torn edge: points every few px pushed in or out.
          function tornOutline(w, h, amp) {
            const pts = [];
            const edge = (x0, y0, x1, y1, nx, ny) => {
              const len = Math.hypot(x1 - x0, y1 - y0);
              const n = Math.ceil(len / 5);
              let drift = 0;
              for (let i = 0; i < n; i++) {
                const f = i / n;
                drift = drift * 0.6 + (tornRnd() - 0.5) * amp;
                const off = drift + (tornRnd() - 0.5) * amp * 0.5;
                pts.push([x0 + (x1 - x0) * f + nx * off, y0 + (y1 - y0) * f + ny * off]);
              }
            };
            edge(0, 0, w, 0, 0, -1);
            edge(w, 0, w, h, 1, 0);
            edge(w, h, 0, h, 0, 1);
            edge(0, h, 0, 0, -1, 0);
            return pts;
          }
          function pathOf(ctx, pts, ox, oy) {
            ctx.beginPath();
            pts.forEach(([x, y], i) =>
              i ? ctx.lineTo(x + ox, y + oy) : ctx.moveTo(x + ox, y + oy),
            );
            ctx.closePath();
          }
          function halftone(ctx, w, h, color) {
            ctx.save();
            ctx.fillStyle = color;
            const cos = Math.cos(DOT.angle);
            const sin = Math.sin(DOT.angle);
            const R = Math.hypot(w, h);
            for (let u = -R; u < R; u += DOT.spacing) {
              for (let v = -R; v < R; v += DOT.spacing) {
                const x = w / 2 + u * cos - v * sin;
                const y = h / 2 + u * sin + v * cos;
                if (x < -8 || y < -8 || x > w + 8 || y > h + 8) continue;
                ctx.beginPath();
                ctx.arc(x, y, DOT.radius, 0, Math.PI * 2);
                ctx.fill();
              }
            }
            ctx.restore();
          }

          // piece({w, h, fill, dots, draw}) -> canvas with a lighter torn rim around the colored paper
          const PAD = 16;
          function piece(o) {
            const c = document.createElement("canvas");
            c.width = o.w + PAD * 2;
            c.height = o.h + PAD * 2;
            const g = c.getContext("2d");
            const rim = tornOutline(o.w + 6, o.h + 6, 5);
            pathOf(g, rim, PAD - 3, PAD - 3);
            g.fillStyle = C.rim;
            g.fill();
            const body = tornOutline(o.w, o.h, 6);
            pathOf(g, body, PAD, PAD);
            g.save();
            g.clip();
            g.fillStyle = o.fill;
            g.fillRect(0, 0, c.width, c.height);
            g.translate(PAD, PAD);
            if (o.dots) halftone(g, o.w, o.h, C.ink);
            if (o.draw) o.draw(g, o.w, o.h);
            // faint paper fiber on the piece
            const img = g.getImageData(0, 0, c.width, c.height);
            const rnd = mulberry(o.w * 7 + o.h);
            for (let i = 0; i < img.data.length; i += 4) {
              if (!img.data[i + 3]) continue;
              const d = (rnd() - 0.5) * 14;
              img.data[i] += d;
              img.data[i + 1] += d;
              img.data[i + 2] += d;
            }
            g.putImageData(img, 0, 0);
            g.restore();
            return c;
          }
          function tape(w, h) {
            const c = document.createElement("canvas");
            c.width = w + 8;
            c.height = h + 8;
            const g = c.getContext("2d");
            // straight long sides, slightly jagged short ends
            const pts = [];
            for (let y = 0; y <= h; y += 4) pts.push([4 + (tornRnd() - 0.5) * 3, 4 + y]);
            for (let y = h; y >= 0; y -= 4) pts.push([4 + w + (tornRnd() - 0.5) * 3, 4 + y]);
            pathOf(g, pts, 0, 0);
            g.fillStyle = C.tape;
            g.fill();
            return c;
          }

          // ---------- layout (b-veri) ----------
          const BASE = 1010;
          const BARS = [
            { x: 770, h: 220, fill: C.paperLight, dots: true },
            { x: 990, h: 305, fill: C.blue },
            { x: 1215, h: 395, fill: C.paperLight, dots: true },
            { x: 1440, h: 480, fill: C.blue },
            { x: 1665, h: 575, fill: C.red },
          ];
          const BAR_W = 185;
          // Cut-out number: each character from a different font of the set, on its own torn piece.
          // Turkish puts the percent sign before the number.
          const LETTERS = [
            {
              ch: "%",
              font: '900 210px "Archivo"',
              color: C.ink,
              fill: C.paperLight,
              w: 236,
              h: 276,
              cx: 1030,
              cy: 238,
              rot: -3,
            },
            {
              ch: "7",
              font: '300px "Alfa Slab One"',
              color: C.ink,
              fill: C.red,
              w: 248,
              h: 340,
              cx: 1272,
              cy: 222,
              rot: 4,
            },
            {
              ch: "3",
              font: '320px "Anton"',
              color: C.paperLight,
              fill: C.blue,
              w: 196,
              h: 330,
              cx: 1500,
              cy: 234,
              rot: -4,
            },
          ];

          const items = [];
          function add(canvas, cx, cy, rot, t0, seed) {
            items.push({ canvas, cx, cy, rot: (rot * Math.PI) / 180, t0, seed });
          }

          function build() {
            const label = piece({
              w: 470,
              h: 92,
              fill: C.paperLight,
              draw: (g, w, h) => {
                g.fillStyle = C.ink;
                g.font = '700 58px "Archivo"';
                g.textBaseline = "middle";
                g.fillText("Dönüşüm oranı", 26, h / 2 + 3);
              },
            });
            add(label, 130 + 235, 520, -2, 0.2, 1);

            BARS.forEach((b, i) => {
              const t0 = 0.55 + i * 0.09;
              const cy = BASE - b.h / 2;
              const r = mulberry(40 + i)();
              add(
                piece({ w: BAR_W, h: b.h, fill: b.fill, dots: b.dots }),
                b.x + BAR_W / 2,
                cy,
                (r - 0.5) * 2,
                t0,
                10 + i,
              );
              add(
                tape(84, 40),
                b.x + BAR_W / 2 + (r - 0.5) * 30,
                BASE - b.h + 4,
                (r - 0.5) * 18,
                t0 + 0.14,
                20 + i,
              );
            });

            // letters land on the spoken syllables
            const SYLLABLES = [1.55, 1.85, 2.15];
            LETTERS.forEach((L, i) => {
              const c = piece({
                w: L.w,
                h: L.h,
                fill: L.fill,
                draw: (g, w, h) => {
                  g.fillStyle = L.color;
                  g.font = L.font;
                  g.textAlign = "center";
                  g.textBaseline = "alphabetic";
                  const m = g.measureText(L.ch);
                  const asc = m.actualBoundingBoxAscent;
                  const desc = m.actualBoundingBoxDescent;
                  g.fillText(L.ch, w / 2, h / 2 + (asc - desc) / 2);
                },
              });
              add(c, L.cx, L.cy, L.rot, SYLLABLES[i], 30 + i);
            });
          }

          // ---------- frame from time ----------
          const page = document.getElementById("s1-page");
          const ctx = page.getContext("2d");
          const SLAP = 0.22;
          const BEATS = [3.1, 3.9]; // on beats pieces jump to a new tiny rotation, stop motion style

          function renderAt(t) {
            ctx.clearRect(0, 0, W, H);
            for (const it of items) {
              const p = clamp((t - it.t0) / SLAP);
              if (p <= 0) continue;
              const e = power4Out(p);
              const scale = 1.08 - 0.08 * e;
              const settle = (1 - e) * 0.05;
              const beat = BEATS.filter((b) => t >= b).length;
              const jitter = beat ? (mulberry(it.seed * 31 + beat)() - 0.5) * 0.03 : 0;
              ctx.save();
              ctx.translate(it.cx, it.cy);
              ctx.rotate(it.rot + settle + jitter);
              ctx.scale(scale, scale);
              ctx.shadowColor = "rgba(40,30,20,0.22)";
              ctx.shadowBlur = 4;
              ctx.shadowOffsetY = 2;
              ctx.drawImage(it.canvas, -it.canvas.width / 2, -it.canvas.height / 2);
              ctx.restore();
            }
          }

          // ---------- timeline ----------
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady["s1"] = Promise.all([
            document.fonts.load('900 210px "Archivo"'),
            document.fonts.load('700 58px "Archivo"'),
            document.fonts.load('320px "Anton"'),
            document.fonts.load('300px "Alfa Slab One"'),
          ]).then(() => {
            build();
            const driver = { _t: -1 };
            Object.defineProperty(driver, "t", {
              get() {
                return this._t;
              },
              set(v) {
                if (v === this._t) return;
                this._t = v;
                renderAt(v);
              },
            });
            const tl = gsap.timeline({ paused: true });
            tl.fromTo(driver, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none" }, 0);
            renderAt(0);
            window.__timelines["s1"] = tl;
            return true;
          });
        })();
      </script>
    </template>
  </body>
</html>
