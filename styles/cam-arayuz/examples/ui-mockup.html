      <script>
        (function () {
          const MINT = "#7FC8B4";

          function mulberry(seed) {
            return function () {
              seed |= 0;
              seed = (seed + 0x6d2b79f5) | 0;
              let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          // waveform bars: seeded heights, mint on the left fading to slate on the right
          const wave = document.getElementById("s1-wave");
          const rnd = mulberry(17);
          const N = 33;
          for (let i = 0; i < N; i++) {
            const bar = document.createElement("div");
            bar.className = "s1-bar";
            const env = 0.25 + 0.75 * Math.abs(Math.sin((i / N) * Math.PI * 2.3 + 0.4));
            bar.style.height = `${Math.round(20 + env * (60 + rnd() * 100))}px`;
            const k = i / (N - 1);
            const mix = (a, b) => Math.round(a + (b - a) * k);
            bar.style.background = `rgb(${mix(127, 154)},${mix(200, 165)},${mix(180, 200)})`;
            wave.appendChild(bar);
          }

          // the link paths draw on from the card (stroke-dashoffset)
          const links = [...document.querySelectorAll(".s1-link")];
          links.forEach((p) => {
            const len = p.getTotalLength();
            p.style.strokeDasharray = `${len}`;
            p.style.strokeDashoffset = `${len}`;
          });

          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady["s1"] = Promise.all([
            document.fonts.load('200 84px "Inter"'),
            document.fonts.load('500 26px "Inter"'),
          ]).then(() => {
            const tl = gsap.timeline({ paused: true });
            const FOCUS = {
              y: 0,
              opacity: 1,
              filter: "blur(0px)",
              duration: 0.7,
              ease: "expo.out",
            };
            const UNFOCUSED = { y: 24, opacity: 0, filter: "blur(12px)" };

            // light shapes drift slowly behind the glass (under 20 px per second)
            tl.fromTo(
              "#s1-blob-mint",
              { x: -30, y: 10 },
              { x: 40, y: -30, duration: 5, ease: "sine.inOut" },
              0,
            );
            tl.fromTo(
              "#s1-blob-slate",
              { x: 20, y: -10 },
              { x: -50, y: 30, duration: 5, ease: "sine.inOut" },
              0,
            );
            tl.fromTo(
              "#s1-blob-mint-2",
              { x: 0, y: 20 },
              { x: 30, y: -20, duration: 5, ease: "sine.inOut" },
              0,
            );

            // headline and card rise into focus
            tl.fromTo(".s1-hl", UNFOCUSED, { ...FOCUS, stagger: 0.08 }, 0.1);
            tl.fromTo("#s1-card", UNFOCUSED, FOCUS, 0.3);
            tl.fromTo(
              ".s1-bar",
              { scaleY: 0.05 },
              { scaleY: 1, duration: 0.8, ease: "expo.out", stagger: 0.015 },
              0.6,
            );

            // the cursor glides in on a curve (x and y on different eases), clicks the toggle
            tl.fromTo(
              "#s1-cursor",
              { x: 1500, y: 1120 },
              { x: 980, duration: 0.65, ease: "power2.inOut" },
              1.0,
            );
            tl.to("#s1-cursor", { y: 676, duration: 0.65, ease: "sine.out" }, 1.0);
            tl.fromTo(
              "#s1-ripple-1",
              { x: 984, y: 680, scale: 0.2, opacity: 0.9 },
              { scale: 1.6, opacity: 0, duration: 0.45, ease: "expo.out" },
              1.68,
            );
            tl.to("#s1-knob", { x: 30, duration: 0.3, ease: "expo.out" }, 1.7);
            tl.to(
              "#s1-toggle",
              { backgroundColor: "rgba(127,200,180,0.55)", borderColor: MINT, duration: 0.3 },
              1.7,
            );

            // then the button: it activates with a mint border, glow and a tiny scale up
            tl.to("#s1-cursor", { x: 1250, duration: 0.55, ease: "power2.inOut" }, 1.95);
            tl.to("#s1-cursor", { y: 680, duration: 0.55, ease: "sine.inOut" }, 1.95);
            tl.fromTo(
              "#s1-ripple-2",
              { x: 1252, y: 684, scale: 0.2, opacity: 0.9 },
              { scale: 1.6, opacity: 0, duration: 0.45, ease: "expo.out" },
              2.55,
            );
            tl.to(
              "#s1-button",
              {
                scale: 1.04,
                borderColor: MINT,
                boxShadow: "0 0 0 1px #7FC8B4, 0 0 32px rgba(127,200,180,0.45)",
                duration: 0.35,

              },
              2.57,
            );
            tl.to("#s1-cursor", { x: 1330, y: 800, duration: 0.6, ease: "power2.inOut" }, 2.9);

            // links draw on, output tiles rise into focus, the first one turns active
            tl.to(
              ".s1-link",
              { strokeDashoffset: 0, duration: 0.8, ease: "expo.out", stagger: 0.08 },

            tl.fromTo(".s1-tile", UNFOCUSED, { ...FOCUS, stagger: 0.08 }, 2.95);

              3.7,

            window.__timelines["s1"] = tl;
            return true;
