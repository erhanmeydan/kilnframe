packages:
  - packages/*
allowBuilds:
  esbuild: true
  # downloads the Electron binary for this platform (packages/app)
  electron: true
  electron-builder: false
  # Squirrel installer for Windows; we build NSIS installers instead
  electron-winstaller: false
  # Prebuilt macOS/Windows binaries ship in the package; the script only fetches Linux CUDA providers.
  onnxruntime-node: false
  protobufjs: false
  # its postinstall only prints a funding message
  tesseract.js: false
minimumReleaseAgeExclude:
  - hyperframes@0.9.42
# security fixes for build tools whose own ranges hold the old versions (issue #1, 2026-11-01)
overrides:
  undici@6: ^6.29.1
  fast-uri@3: ^3.1.9
  # 1.10 uses import.source, which the Node inside Electron cannot parse: OCR of added images crashed the job
  wasm-feature-detect: 1.9.0
patchedDependencies:
  hyperframes@0.9.42: patches/hyperframes@0.9.42.patch
