<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:"Caption";src:url("font.ttf") format("truetype");font-weight:600}
html,body{margin:0;background:transparent}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent}
#captions{position:absolute;inset:0}
.line{position:absolute;left:0;right:0;top:1315px;align-items:center;height:0;display:flex;justify-content:center;opacity:0}
.block{text-align:center}
.row{white-space:nowrap}
.block{background:#1c2537;border-radius:22px;padding:20px 34px 26px;box-shadow:0 18px 40px rgba(10,14,24,.35);font-family:Caption;font-weight:600;line-height:1.32;letter-spacing:-.02em;color:#efe8dd}
.w{display:inline-block;position:relative}
.w i{position:absolute;left:0;right:0;bottom:-6px;height:7px;border-radius:4px;background:#d9875f;transform:scaleX(0);transform-origin:0 50%}
</style>
</head>
<body>
<div id="root" data-composition-id="captions" data-start="0" data-width="1080" data-height="1920" data-duration="10">
<div id="captions" class="clip" data-start="0" data-duration="10" data-track-index="0">
<div class="line" id="l0"><div class="block" style="font-size:56px"><div class="row"><span class="w" id="w0_0">Hello<i></i></span> <span class="w" id="w0_1">and<i></i></span></div><div class="row"><span class="w" id="w0_2">welcome<i></i></span> <span class="w" id="w0_3">back<i></i></span></div></div></div>
<div class="line" id="l1"><div class="block" style="font-size:56px"><div class="row"><span class="w" id="w1_0">the<i></i></span> <span class="w" id="w1_1">quick<i></i></span> <span class="w" id="w1_2">brown<i></i></span></div><div class="row"><span class="w" id="w1_3">fox<i></i></span> <span class="w" id="w1_4">jumps<i></i></span> <span class="w" id="w1_5">over<i></i></span></div></div></div>
<div class="line" id="l2"><div class="block" style="font-size:56px"><div class="row"><span class="w" id="w2_0">lazy<i></i></span> <span class="w" id="w2_1">dogs<i></i></span> <span class="w" id="w2_2">sleep<i></i></span></div></div></div>
</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.set("#l0",{opacity:1},0.500);tl.set("#l0",{opacity:0},2.850);
tl.fromTo("#l0 .block",{opacity:0,y:10},{opacity:1,y:0,duration:0.16,ease:"power2.out"},0.500);
tl.fromTo("#w0_0 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},0.500);tl.set("#w0_0 i",{scaleX:0},1.000);
tl.fromTo("#w0_1 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},1.000);tl.set("#w0_1 i",{scaleX:0},1.500);
tl.fromTo("#w0_2 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},1.500);tl.set("#w0_2 i",{scaleX:0},2.000);
tl.fromTo("#w0_3 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},2.000);tl.set("#w0_3 i",{scaleX:0},2.500);
tl.set("#l1",{opacity:1},3.000);tl.set("#l1",{opacity:0},5.000);
tl.set("#l1",{opacity:1},5.500);tl.set("#l1",{opacity:0},6.350);
tl.fromTo("#l1 .block",{opacity:0,y:10},{opacity:1,y:0,duration:0.16,ease:"power2.out"},3.000);
tl.fromTo("#w1_0 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},3.000);tl.set("#w1_0 i",{scaleX:0},3.500);
tl.fromTo("#w1_1 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},3.500);tl.set("#w1_1 i",{scaleX:0},4.000);
tl.fromTo("#w1_2 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},4.000);tl.set("#w1_2 i",{scaleX:0},4.500);
tl.fromTo("#w1_3 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},4.500);tl.set("#w1_3 i",{scaleX:0},5.000);
tl.fromTo("#w1_4 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},5.000);tl.set("#w1_4 i",{scaleX:0},5.500);
tl.fromTo("#w1_5 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},5.500);tl.set("#w1_5 i",{scaleX:0},6.000);
tl.set("#l2",{opacity:1},8.200);tl.set("#l2",{opacity:0},9.750);
tl.fromTo("#l2 .block",{opacity:0,y:10},{opacity:1,y:0,duration:0.16,ease:"power2.out"},8.200);
tl.fromTo("#w2_0 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},0.000);tl.set("#w2_0 i",{scaleX:0},8.600);
tl.fromTo("#w2_1 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},8.600);tl.set("#w2_1 i",{scaleX:0},9.000);
tl.fromTo("#w2_2 i",{scaleX:0},{scaleX:1,duration:0.060,ease:"power2.out"},9.000);tl.set("#w2_2 i",{scaleX:0},9.400);
window.__timelines["captions"] = tl;
</script>
</body>
</html>
