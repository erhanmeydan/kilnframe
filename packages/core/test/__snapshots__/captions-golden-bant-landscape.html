<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:"Caption";src:url("font.ttf") format("truetype");font-weight:600}
html,body{margin:0;background:transparent}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent}
#captions{position:absolute;inset:0}
.line{position:absolute;left:0;right:0;bottom:120px;align-items:flex-end;height:0;display:flex;justify-content:center;opacity:0}
.block{text-align:center}
.row{white-space:nowrap}
.block{background:rgba(10,12,16,0.62);border-radius:14px;padding:14px 28px 16px;font-family:Caption;font-weight:600;line-height:1.28;letter-spacing:-.01em;color:#ffffff}
</style>
</head>
<body>
<div id="root" data-composition-id="captions" data-start="0" data-width="1920" data-height="1080" data-duration="10">
<div id="captions" class="clip" data-start="0" data-duration="10" data-track-index="0">
<div class="line" id="l0"><div class="block" style="font-size:54px"><div class="row"><span class="w" id="w0_0">Hello</span> <span class="w" id="w0_1">and</span> <span class="w" id="w0_2">welcome</span> <span class="w" id="w0_3">back</span></div></div></div>
<div class="line" id="l1"><div class="block" style="font-size:54px"><div class="row"><span class="w" id="w1_0">the</span> <span class="w" id="w1_1">quick</span> <span class="w" id="w1_2">brown</span> <span class="w" id="w1_3">fox</span> <span class="w" id="w1_4">jumps</span> <span class="w" id="w1_5">over</span></div></div></div>
<div class="line" id="l2"><div class="block" style="font-size:54px"><div class="row"><span class="w" id="w2_0">lazy</span> <span class="w" id="w2_1">dogs</span> <span class="w" id="w2_2">sleep</span></div></div></div>
</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.set("#l0",{opacity:1},0.500);tl.set("#l0",{opacity:0},2.850);
tl.fromTo("#l0 .block",{opacity:0,y:8},{opacity:1,y:0,duration:0.2,ease:"power2.out"},0.500);tl.to("#l0 .block",{opacity:0,duration:0.140,ease:"power1.in"},2.710);
tl.set("#l1",{opacity:1},3.000);tl.set("#l1",{opacity:0},5.000);
tl.set("#l1",{opacity:1},5.500);tl.set("#l1",{opacity:0},6.350);
tl.fromTo("#l1 .block",{opacity:0,y:8},{opacity:1,y:0,duration:0.2,ease:"power2.out"},3.000);tl.to("#l1 .block",{opacity:0,duration:0.140,ease:"power1.in"},6.210);
tl.set("#l2",{opacity:1},8.200);tl.set("#l2",{opacity:0},9.750);
tl.fromTo("#l2 .block",{opacity:0,y:8},{opacity:1,y:0,duration:0.2,ease:"power2.out"},8.200);tl.to("#l2 .block",{opacity:0,duration:0.140,ease:"power1.in"},9.610);
window.__timelines["captions"] = tl;
</script>
</body>
</html>
