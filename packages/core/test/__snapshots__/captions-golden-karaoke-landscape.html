<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:"Caption";src:url("font.ttf") format("truetype");font-weight:700}
html,body{margin:0;background:transparent}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent}
#captions{position:absolute;inset:0}
.line{position:absolute;left:0;right:0;bottom:120px;align-items:flex-end;height:0;display:flex;justify-content:center;opacity:0}
.block{text-align:center}
.row{white-space:nowrap}
.block{position:relative;z-index:0;font-family:Caption;font-weight:700;line-height:1.2;letter-spacing:-0.01em;color:#ffffff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.block::before{content:"";position:absolute;z-index:-1;inset:-.28em -.5em;border-radius:.7em;background:rgba(6,8,12,.6);filter:blur(26px)}
.w{display:inline-block;position:relative;opacity:0.48}
.f{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden;white-space:nowrap;color:#7be0ff;text-shadow:none}
.w.said{opacity:1}
.w.said .f{width:100%}
</style>
</head>
<body>
<div id="root" data-composition-id="captions" data-start="0" data-width="1920" data-height="1080" data-duration="10">
<div id="captions" class="clip" data-start="0" data-duration="10" data-track-index="0">
<div class="line" id="l0"><div class="block" style="font-size:64px"><div class="row"><span class="w" id="w0_0">Hello<span class="f" aria-hidden="true">Hello</span></span> <span class="w" id="w0_1">and<span class="f" aria-hidden="true">and</span></span> <span class="w" id="w0_2">welcome<span class="f" aria-hidden="true">welcome</span></span> <span class="w" id="w0_3">back<span class="f" aria-hidden="true">back</span></span></div></div></div>
<div class="line" id="l1"><div class="block" style="font-size:64px"><div class="row"><span class="w" id="w1_0">the<span class="f" aria-hidden="true">the</span></span> <span class="w" id="w1_1">quick<span class="f" aria-hidden="true">quick</span></span> <span class="w" id="w1_2">brown<span class="f" aria-hidden="true">brown</span></span> <span class="w" id="w1_3">fox<span class="f" aria-hidden="true">fox</span></span> <span class="w" id="w1_4">jumps<span class="f" aria-hidden="true">jumps</span></span> <span class="w" id="w1_5">over<span class="f" aria-hidden="true">over</span></span></div></div></div>
<div class="line" id="l2"><div class="block" style="font-size:64px"><div class="row"><span class="w" id="w2_0">lazy<span class="f" aria-hidden="true">lazy</span></span> <span class="w" id="w2_1">dogs<span class="f" aria-hidden="true">dogs</span></span> <span class="w" id="w2_2">sleep<span class="f" aria-hidden="true">sleep</span></span></div></div></div>
</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.set("#l0",{opacity:1},0.500);tl.set("#l0",{opacity:0},2.850);
tl.fromTo("#l0 .block",{opacity:0,y:8},{opacity:1,y:0,duration:0.16,ease:"power2.out"},0.500);
tl.set("#w0_0",{opacity:1},0.500);tl.fromTo("#w0_0 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},0.500);
tl.set("#w0_1",{opacity:1},1.000);tl.fromTo("#w0_1 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},1.000);
tl.set("#w0_2",{opacity:1},1.500);tl.fromTo("#w0_2 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},1.500);
tl.set("#w0_3",{opacity:1},2.000);tl.fromTo("#w0_3 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},2.000);
tl.set("#l1",{opacity:1},3.000);tl.set("#l1",{opacity:0},5.000);
tl.set("#l1",{opacity:1},5.500);tl.set("#l1",{opacity:0},6.350);
tl.fromTo("#l1 .block",{opacity:0,y:8},{opacity:1,y:0,duration:0.16,ease:"power2.out"},3.000);
tl.set("#w1_0",{opacity:1},3.000);tl.fromTo("#w1_0 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},3.000);
tl.set("#w1_1",{opacity:1},3.500);tl.fromTo("#w1_1 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},3.500);
tl.set("#w1_2",{opacity:1},4.000);tl.fromTo("#w1_2 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},4.000);
tl.set("#w1_3",{opacity:1},4.500);tl.fromTo("#w1_3 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},4.500);
tl.set("#w1_4",{opacity:1},5.000);tl.fromTo("#w1_4 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},5.000);
tl.set("#w1_5",{opacity:1},5.500);tl.fromTo("#w1_5 .f",{width:"0%"},{width:"100%",duration:0.500,ease:"none"},5.500);
tl.set("#l2",{opacity:1},8.200);tl.set("#l2",{opacity:0},9.750);
tl.fromTo("#l2 .block",{opacity:0,y:8},{opacity:1,y:0,duration:0.16,ease:"power2.out"},8.200);
tl.set("#w2_0",{opacity:1},0.000);tl.fromTo("#w2_0 .f",{width:"0%"},{width:"100%",duration:0.900,ease:"none"},0.000);
tl.set("#w2_1",{opacity:1},8.600);tl.fromTo("#w2_1 .f",{width:"0%"},{width:"100%",duration:0.400,ease:"none"},8.600);
tl.set("#w2_2",{opacity:1},9.000);tl.fromTo("#w2_2 .f",{width:"0%"},{width:"100%",duration:0.400,ease:"none"},9.000);
window.__timelines["captions"] = tl;
</script>
</body>
</html>
