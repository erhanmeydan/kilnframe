<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:"Caption";src:url("font.ttf") format("truetype");font-weight:400}
html,body{margin:0;background:transparent}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent}
#captions{position:absolute;inset:0}
.line{position:absolute;left:0;right:0;top:1315px;align-items:center;height:0;display:flex;justify-content:center;opacity:0}
.block{text-align:center}
.row{white-space:nowrap}
.block{font-family:Caption;font-weight:400;line-height:1.3;letter-spacing:0.01em;color:#e4e1da;position:relative;z-index:0;text-shadow:0 1px 2px rgba(0,0,0,.5),0 0 14px rgba(0,0,0,.4)}
.block::before{content:"";position:absolute;z-index:-1;inset:-.3em -.9em;border-radius:2em;background:rgba(6,8,12,.34);filter:blur(40px)}
</style>
</head>
<body>
<div id="root" data-composition-id="captions" data-start="0" data-width="1080" data-height="1920" data-duration="10">
<div id="captions" class="clip" data-start="0" data-duration="10" data-track-index="0">
<div class="line" id="l0"><div class="block" style="font-size:54px"><div class="row"><span class="w" id="w0_0">hello</span> <span class="w" id="w0_1">and</span> <span class="w" id="w0_2">welcome</span> <span class="w" id="w0_3">back</span></div></div></div>
<div class="line" id="l1"><div class="block" style="font-size:54px"><div class="row"><span class="w" id="w1_0">the</span> <span class="w" id="w1_1">quick</span> <span class="w" id="w1_2">brown</span> <span class="w" id="w1_3">fox</span> <span class="w" id="w1_4">jumps</span> <span class="w" id="w1_5">over</span></div></div></div>
<div class="line" id="l2"><div class="block" style="font-size:54px"><div class="row"><span class="w" id="w2_0">lazy</span> <span class="w" id="w2_1">dogs</span> <span class="w" id="w2_2">sleep</span></div></div></div>
</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.set("#l0",{opacity:1},0.500);tl.set("#l0",{opacity:0},2.850);
tl.fromTo("#l0 .block",{opacity:0},{opacity:1,duration:0.24,ease:"power1.out"},0.500);
tl.set("#l1",{opacity:1},3.000);tl.set("#l1",{opacity:0},5.000);
tl.set("#l1",{opacity:1},5.500);tl.set("#l1",{opacity:0},6.350);
tl.fromTo("#l1 .block",{opacity:0},{opacity:1,duration:0.24,ease:"power1.out"},3.000);
tl.set("#l2",{opacity:1},8.200);tl.set("#l2",{opacity:0},9.750);
tl.fromTo("#l2 .block",{opacity:0},{opacity:1,duration:0.24,ease:"power1.out"},8.200);
window.__timelines["captions"] = tl;
</script>
</body>
</html>
