<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script defer src="./index.js"></script>
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        margin: 0;
        background: #232323;
        color: #d6d6d6;
        font-size: 12px;
      }
      /* the panel scrolls inside #app: a short panel otherwise hid the button at the bottom */
      #app {
        height: 100%;
        box-sizing: border-box;
        overflow: hidden;
      }
      /* UXP ignores flex-shrink and the height of absolute boxes: the bar stays in the flow and app.ts sizes
         the scroll area above it to the panel's height */
      .scroll {
        height: 100%;
        box-sizing: border-box;
        overflow-y: scroll;
        padding: 12px 12px 20px;
      }
      /* the range tab's main button never scrolls away (panel design, 8 Oct 2026) */
      .actionbar {
        box-sizing: border-box;
        border-top: 1px solid #303030;
        background: #262626;
        padding: 8px 12px 10px;
      }
      /* fixed heights: UXP shrinks flex children that ask for more room than they get */
      .actionbar .row {
        height: 16px;
        flex-shrink: 0;
      }
      /* a bar with only the tab's main button */
      .actionbar.solo .btn {
        margin-top: 0;
      }
      .actionbar .btn {
        margin-top: 6px;
        height: 32px;
        box-sizing: border-box;
        flex-shrink: 0;
      }
      /* fewer boxes (panel design 2, 8 Oct 2026): frames only on things that are clicked or typed in */
      .rangeline {
        padding: 2px 0 8px;
        border-bottom: 1px solid #303030;
        margin-top: 10px;
      }
      .style-row {
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      .style-thumb {
        border: 2px solid #5b8cff;
        border-radius: 4px;
        cursor: pointer;
      }
      .style-row .rec-text {
        margin-left: 8px;
      }
      .link {
        color: #9db6ff;
        font-size: 11px;
        cursor: pointer;
        padding: 4px 2px;
      }
      .add {
        display: flex;
        flex-direction: row;
        align-items: center;
        color: #d6d6d6;
        padding: 4px 0;
        cursor: pointer;
      }
      .add .plus {
        width: 18px;
        height: 18px;
        line-height: 16px;
        text-align: center;
        border: 1px dashed #6a6a6a;
        border-radius: 4px;
        color: #b4b4b4;
        margin-right: 8px;
      }
      /* one list row for voices, providers and models: a hairline under each, the picked one on a calm
         ground in bold white */
      .vlist .vrow,
      .prow,
      .mrow {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 8px 4px;
        border-bottom: 1px solid #303030;
        cursor: pointer;
      }
      /* a voice row is clicked on its name, which carries the row's height */
      .vlist .vrow {
        padding: 4px;
      }
      .vlist .vrow.on,
      .prow.on,
      .mrow.on {
        background: #262a31;
        border-radius: 4px;
      }
      .vname,
      .pname,
      .mname {
        flex: 1;
        color: #e6e6e6;
      }
      .vname {
        padding: 4px 0;
        cursor: pointer;
      }
      .vrow.on .vname,
      .prow.on .pname,
      .mrow.on .mname {
        color: #fff;
        font-weight: 700;
      }
      .more {
        margin-top: 4px;
      }
      /* settings: providers, keys, models (settings design, 8 Oct 2026) */
      /* a group of the settings' provider list: Your Plan, API Key, On This Computer */
      .pgroup {
        font-size: 11px;
        color: #8f8f8f;
        margin: 12px 0 4px 4px;
      }
      .pdot {
        width: 10px;
        height: 10px;
        border-radius: 6px;
        border: 1px solid #6a6a6a;
        margin-right: 8px;
      }
      .prow.on .pdot {
        border-color: #5b8cff;
        background: #5b8cff;
      }
      .ptag {
        font-size: 10px;
        border-radius: 4px;
        padding: 1px 4px;
        border: 1px solid #4a4a4a;
        color: #b4b4b4;
      }
      .ptag.recommended {
        color: #8fd6a8;
        border-color: #2f5a3d;
      }
      .ptag.none {
        border-color: transparent;
      }
      /* a status word at a row's end, in settings and in the setup guide: muted, green when set */
      .pkey,
      .ostatus {
        font-size: 11px;
        color: #8f8f8f;
      }
      .pkey {
        white-space: nowrap;
        min-width: 64px;
        margin-left: 10px;
        text-align: right;
      }
      .pkey.set,
      .pkey.upd {
        color: #8fd6a8;
      }
      .pkey.upd {
        font-weight: 700;
      }
      .pdetail {
        background: #262a31;
        border: 1px solid #353c48;
        border-radius: 6px;
        padding: 8px 10px;
        margin: 6px 0 4px;
      }
      .pfield {
        background: #2b2b2b;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 6px 8px;
        margin: 6px 0;
      }
      .ptest {
        margin-top: 8px;
        font-size: 11px;
      }
      /* setup guide (onboarding design, 8 Oct 2026): one line per step, the current one opens */
      .hello {
        font-size: 13px;
        font-weight: 700;
        color: #e6e6e6;
        margin-bottom: 4px;
      }
      .ostep {
        border-bottom: 1px solid #303030;
        padding: 8px 2px;
      }
      .otop {
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      .omark {
        width: 18px;
        height: 18px;
        line-height: 18px;
        border-radius: 9px;
        text-align: center;
        font-size: 10px;
        font-weight: 700;
        margin-right: 8px;
        border: 1px solid #6a6a6a;
        color: #7a7a7a;
      }
      .omark.done {
        background: #24432f;
        border-color: #24432f;
        color: #8fd6a8;
      }
      .omark.now {
        border: 2px solid #5b8cff;
        color: #5b8cff;
      }
      .omark.warn {
        background: #4a3b1c;
        border-color: #4a3b1c;
        color: #e0b050;
      }
      .oname {
        flex: 1;
        color: #e6e6e6;
      }
      .ostep.now .oname {
        color: #fff;
        font-weight: 700;
      }
      .ostep.done .ostatus {
        color: #8fd6a8;
      }
      .ostep.warn .ostatus {
        color: #e0b050;
      }
      .obody {
        margin: 8px 0 2px 26px;
      }
      .strip {
        display: flex;
        flex-direction: row;
        margin-top: 6px;
      }
      .strip-img {
        border-radius: 4px;
        margin-right: 4px;
        cursor: pointer;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .title {
        font-size: 13px;
        font-weight: 700;
        color: #e6e6e6;
      }
      .brand {
        display: flex;
        align-items: center;
      }
      .brand img {
        width: 18px;
        height: 18px;
        margin-right: 8px;
      }
      .icon {
        color: #b4b4b4;
        font-size: 16px;
        width: 32px;
        height: 28px;
        line-height: 28px;
        text-align: center;
        border-radius: 4px;
        border: 1px solid #3a3a3a;
        cursor: pointer;
      }
      .icon:hover {
        background: #333;
        color: #fff;
      }
      .lbl {
        color: #8f8f8f;
        font-size: 11px;
        margin: 14px 0 6px;
      }
      .box {
        background: #2b2b2b;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 6px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      /* lines of a box (System: companion, GPU, WAV preset) a little apart */
      .box .row + .row {
        margin-top: 4px;
      }
      /* two buttons side by side, equal width (Stop next to Keep Running) */
      .row2 {
        display: flex;
        flex-direction: row;
      }
      .row2 .btn2 {
        flex: 1;
      }
      .row2 .btn2 + .btn2 {
        margin-left: 8px;
      }
      /* links side by side (No Music next to Join With Next) */
      .row2 .link + .link {
        margin-left: 16px;
      }
      .small {
        font-size: 11px;
      }
      .muted {
        color: #8f8f8f;
      }
      .mt {
        margin-top: 8px;
      }
      .mt2 {
        margin-top: 12px;
      }
      /* a second row of choices under the tabs (Story: write or own text) */
      .seg.sub {
        margin-top: 10px;
      }
      /* a note under a field or a choice: clear of both, its lines a little apart */
      .note {
        font-size: 11px;
        line-height: 1.4;
        margin: 8px 0 12px;
      }
      /* a tab's opening line keeps the same distance from the tabs as the range line does */
      .note.intro {
        margin: 10px 0 12px;
        line-height: 1.4;
      }
      /* message boxes by what they say: info is calm (an update, a notice), warn asks for something
         before going on (a key, a range, a version), error says something failed, ok says it is done */
      .box.info {
        background: #262a31;
        border-color: #353c48;
      }
      .box.warn {
        border-color: #6b5320;
      }
      .box.error {
        background: #2c2422;
        border-color: #6a3a33;
      }
      .box.ok {
        border-color: #2f5a3d;
        color: #8fd6a8;
      }
      /* a box right under the range line keeps clear of it */
      .rangeline + .box {
        margin-top: 10px;
      }
      .warn-text {
        color: #e0b050;
      }
      .err-text {
        color: #e8a598;
      }
      .ok-text {
        color: #8fd6a8;
      }
      .rec {
        cursor: pointer;
        display: flex;
        flex-direction: row;
        padding: 6px;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        background: #2b2b2b;
      }
      .rec.sel {
        border-color: #5b8cff;
        background: #26304a;
      }
      .rec-img {
        width: 96px;
        height: 64px;
        border-radius: 4px;
        background: #333;
        flex-shrink: 0;
      }
      .rec-text {
        margin-left: 8px;
        flex: 1;
      }
      .rec-name {
        color: #fff;
        font-weight: 700;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .tiles {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        margin-right: -6px;
      }
      .tile {
        cursor: pointer;
        margin: 0 8px 8px 0;
      }
      .tile.sel .tile-img {
        border-color: #5b8cff;
      }
      .tile.sel .tile-name {
        color: #fff;
      }
      .tile-img {
        border-radius: 4px;
        border: 2px solid #3a3a3a;
        background: #333;
        display: block;
      }
      .soon-img {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed #4a4a4a;
        background: #262626;
      }
      .soon-mark {
        color: #8f8f8f;
        font-size: 11px;
      }
      .soon-mark.plus {
        font-size: 26px;
        line-height: 26px;
      }
      .tile.soon .tile-name {
        color: #8f8f8f;
      }
      .tile-name {
        font-size: 10px;
        color: #b4b4b4;
        text-align: center;
        margin-top: 4px;
      }
      .seg {
        display: flex;
        flex-direction: row;
        border: 1px solid #4a4a4a;
        border-radius: 6px;
        overflow: hidden;
      }
      .seg .opt {
        flex: 1;
        text-align: center;
        color: #b4b4b4;
        padding: 6px 0;
        font-size: 11px;
        cursor: pointer;
      }
      .seg .opt.on {
        background: #444;
        color: #fff;
      }
      /* the home tabs: one row from the panel's 360 px minimum; each label as wide as its text, never
         wrapped (six equal parts would cut "Remove Pauses" in two), a little smaller than other options */
      .seg.tabs {
        flex-wrap: nowrap;
        /* where you are, drawn apart from the choices under it: a line under the row, the open tab
           underlined in the accent */
        border: none;
        border-radius: 0;
        border-bottom: 1px solid #303030;
      }
      .seg.tabs .opt {
        flex: 1 1 auto;
        padding: 6px 4px 7px;
        font-size: 10px;
        white-space: nowrap;
        color: #8f8f8f;
        border-bottom: 2px solid transparent;
      }
      .seg.tabs .opt.on {
        background: transparent;
        color: #fff;
        font-weight: 700;
        border-bottom-color: #5b8cff;
      }
      /* Remove Pauses: the slider and the bar of kept speech and cut pauses */
      .pause-slider {
        width: 100%;
        margin: 6px 0 2px;
      }
      /* about an audio track's height in the editor; kept speech in Kilnframe's clay orange, the cut pauses
         as dark gaps edged in the darker clay */
      .pause-bar {
        display: flex;
        flex-direction: row;
        height: 72px;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid #c4683e;
        background: #241c18;
      }
      .pause-keep {
        height: 72px;
        background: #d9875f;
      }
      .pause-cut {
        box-sizing: border-box;
        height: 72px;
        /* plain colours: UXP's CSS has no repeating gradients to hatch with */
        background: #1e1714;
        border-left: 1px solid #c4683e;
        border-right: 1px solid #c4683e;
      }
      /* one field look for text boxes and one-line inputs */
      textarea,
      .field {
        width: 100%;
        box-sizing: border-box;
        /* UXP fills a native field's padding with this near black and paints the page colour only under the
           text: a field of the same colour shows no ring, so the text can sit away from the frame */
        background: #0e0e0e;
        color: #e6e6e6;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        /* UXP's native field pads itself; our padding showed as a thick black ring around the text */
        padding: 0;
        /* UXP gives native fields a margin of their own: the label above sat far from its box */
        margin: 0;
        font-size: 12px;
      }
      /* a one-line input keeps the 11 px text and 4 px corners it had: at 12 px UXP showed a black strip
         under the text */
      input.field {
        font-size: 11px;
        border-radius: 4px;
        height: 28px;
      }
      /* UXP drops a one-line input's side padding and indent, so the frame is a box around it that holds
         the room; the input inside has no frame of its own */
      .fieldbox {
        background: #0e0e0e;
        border: 1px solid #3a3a3a;
        border-radius: 4px;
        padding: 0 6px;
        margin-top: 4px;
      }
      .fieldbox .field {
        /* with no border UXP draws its own faint frame; one in the box's colour hides it */
        border: 1px solid #0e0e0e;
        border-radius: 0;
        margin: 0;
        height: 26px;
      }
      textarea {
        padding: 4px 2px;
      }
      /* UXP ignores rows, so heights are set here */
      textarea {
        min-height: 48px;
      }
      /* a one-line text box: a textarea, since UXP's one-line input draws a frame of its own and drops
         side padding */
      textarea.one {
        min-height: 0;
        height: 28px;
        padding: 4px 2px;
        overflow: hidden;
      }
      #own-desc {
        min-height: 110px;
      }
      #own-redo,
      #scenenote {
        min-height: 64px;
      }
      /* one button family: .btn is the main action, .btn2 the others, both full width; .sm makes either a
         small button in a .btns row; .on marks a picked one (a track), .danger stops, .off cannot be pressed */
      .btn,
      .btn2 {
        border-radius: 6px;
        padding: 8px;
        font-size: 12px;
        text-align: center;
        cursor: pointer;
      }
      .btn {
        margin-top: 10px;
        background: #2d64c8;
        border: 1px solid #2d64c8;
        color: #fff;
        font-weight: 700;
      }
      .btn2 {
        color: #d6d6d6;
        border: 1px solid #4a4a4a;
      }
      .btn.off {
        background: #3a3a3a;
        border-color: #3a3a3a;
        color: #8f8f8f;
      }
      .btn2.off {
        color: #7a7a7a;
        cursor: default;
      }
      .btn2.on {
        background: #26304a;
        border-color: #5b8cff;
        color: #fff;
        font-weight: 700;
      }
      .btn2.danger {
        color: #e8a598;
        border-color: #6a3a33;
      }
      .btns {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .btn.sm,
      .btn2.sm {
        margin: 0 6px 6px 0;
        padding: 6px 10px;
      }
      /* Premiere in the background: the first click only brings it forward (docs/ilk-animasyon.md) */
      #app.asleep .btn {
        background: #263a63;
        border-color: #263a63;
        color: #9aa6c2;
      }
      #app.asleep .btn2 {
        color: #7a7a7a;
        border-color: #3a3a3a;
      }
      .tag2 {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        background: #3a3a3a;
        color: #d6d6d6;
      }
      .img-slot {
        box-sizing: border-box;
        overflow: hidden;
        background: #333;
      }
      .img-slot img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .img-card {
        margin: 0 8px 10px 0;
      }
      .img-box {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        border: 1px solid #3a3a3a;
        background: #2b2b2b;
        overflow: hidden;
      }
      .img-box.checker {
        background: #3a3a3a;
      }
      .img-name {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: #b4b4b4;
        margin-top: 4px;
        flex: 1;
      }
      .img-x {
        cursor: pointer;
        color: #b4b4b4;
        font-size: 14px;
        width: 22px;
        height: 20px;
        line-height: 20px;
        text-align: center;
        border-radius: 4px;
        margin-top: 2px;
      }
      .img-x:hover {
        background: #3a3a3a;
        color: #fff;
      }
      .field {
        margin-top: 4px;
      }
      /* an install command the editor copies into a terminal */
      .field.cmd {
        font-family: Menlo, Consolas, monospace;
        margin: 4px 0 6px;
      }
      .cmd-row {
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      .cmd-row .field.cmd {
        flex: 1;
        margin-right: 6px;
      }
      .voice {
        box-sizing: border-box;
        cursor: pointer;
        margin: 0 8px 8px 0;
        padding: 6px 8px;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        background: #2b2b2b;
        font-size: 12px;
        color: #e6e6e6;
      }
      .voice.on {
        border-color: #5b8cff;
        background: #26304a;
      }
      #story-brief {
        min-height: 90px;
      }
      #story-script,
      #story-own {
        min-height: 260px;
        line-height: 1.45;
      }
      .gallery {
        display: flex;
        flex-direction: row;
        margin-top: 8px;
      }
      .gal-img {
        cursor: pointer;
        border-radius: 4px;
        margin-right: 6px;
        background: #333;
      }
      .big-img {
        display: block;
        border-radius: 6px;
        background: #333;
      }
      .half {
        flex: 1;
        margin-right: 6px;
      }
      .still-label {
        cursor: pointer;
        margin-top: 4px;
      }
      .stills {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .still {
        margin: 0 8px 10px 0;
        cursor: pointer;
      }
      .still-img,
      .still-empty {
        display: block;
        border-radius: 4px;
        border: 2px solid transparent;
        background: #333;
      }
      .still.redo .still-img,
      .still.redo .still-empty {
        border-color: #e0b050;
      }
      .step {
        display: flex;
        flex-direction: row;
        padding: 4px 0;
      }
      .step .mark {
        width: 18px;
      }
      .step.done .mark {
        color: #8fd6a8;
      }
      .step.now {
        color: #fff;
      }
      .step.now .mark {
        color: #5b8cff;
      }
      .step.todo {
        color: #7a7a7a;
      }
      .bar {
        height: 4px;
        background: #3a3a3a;
        border-radius: 2px;
        margin: 10px 0 4px;
      }
      .bar div {
        height: 4px;
        background: #5b8cff;
        border-radius: 2px;
      }
      .cap-top {
        margin-top: 10px;
      }
      /* the Captions tab: each look drawn small in its own colours, over a neutral frame */
      .cap-frame {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        background: #4a4a4a;
        overflow: hidden;
      }
      .cap-sample {
        margin-bottom: 8px;
        padding: 1px 4px;
        border-radius: 2px;
        font-size: 9px;
        line-height: 13px;
        white-space: nowrap;
      }
      .cap-condensed {
        font-family: Impact, "Arial Narrow", sans-serif;
        font-size: 10px;
        letter-spacing: 0.3px;
      }
      .cap-mono {
        font-family: Menlo, Consolas, monospace;
      }
      .cap-serif {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 10px;
      }
      /* the look grid fills the row: three tiles, two gaps, the third tile without a right margin */
      .cap-tiles {
        margin-right: 0;
      }
      /* "Play" while its preview is made: in the links' place, not clickable */
      .cap-wait {
        color: #8f8f8f;
        cursor: default;
      }
      .cap-still {
        overflow: hidden;
        background: #333;
      }
      .cap-player {
        display: block;
        margin: 4px 0 6px;
        border-radius: 4px;
        overflow: hidden;
        background: #262626;
      }
      .cw.pill {
        border-radius: 4px;
        padding: 0 4px;
      }
      .swatches {
        display: flex;
        flex-direction: row;
      }
      .swatch {
        flex: 1;
        display: flex;
        flex-direction: row;
        /* the chip sits beside its field, under the label line */
        align-items: flex-end;
      }
      .swatch + .swatch {
        margin-left: 10px;
      }
      .chip {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        border: 1px solid #4a4a4a;
        margin-right: 6px;
        margin-bottom: 2px;
        flex-shrink: 0;
      }
      .chip {
        cursor: pointer;
      }
      .chip.on {
        border-color: #fff;
      }
      /* the colour picker under the swatches: quiet colours, then the picked one from dark to light */
      .picker {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        margin-top: 8px;
        padding: 8px;
        background: #2b2b2b;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
      }
      .wheel {
        flex-shrink: 0;
        margin-right: 10px;
        cursor: crosshair;
      }
      .pk-side {
        flex: 1;
      }
      .pk-row {
        display: flex;
        flex-direction: row;
      }
      .pk-row + .pk-row {
        margin-top: 4px;
      }
      .pk {
        flex: 1;
        height: 22px;
        border-radius: 4px;
        border: 1px solid #4a4a4a;
      }
      .pk + .pk {
        margin-left: 4px;
      }
      .pk.on {
        border-color: #fff;
      }
      .pk-label {
        color: #8f8f8f;
        font-size: 11px;
        margin: 8px 0 4px;
      }
      .swatch-text {
        flex: 1;
      }
      .swatch-text .field,
      .swatch-text textarea.one {
        margin-top: 4px;
      }
      .check {
        display: flex;
        flex-direction: row;
        align-items: center;
        cursor: pointer;
        color: #d6d6d6;
        padding: 4px 0;
      }
      .box-mark {
        width: 14px;
        height: 14px;
        line-height: 14px;
        text-align: center;
        font-size: 10px;
        color: #fff;
        border: 1px solid #6a6a6a;
        border-radius: 4px;
        margin-right: 8px;
      }
      .box-mark.on {
        background: #2d64c8;
        border-color: #2d64c8;
      }
      /* the lines to check: a corrected one carries the accent on its left edge */
      .clines {
        margin-top: 6px;
        border-top: 1px solid #303030;
      }
      .cline {
        border-bottom: 1px solid #303030;
        border-left: 2px solid transparent;
        padding: 6px 0 4px 8px;
      }
      .cline.changed {
        border-left-color: #5b8cff;
      }
      .ctag {
        font-size: 10px;
        color: #9db6ff;
      }
      .cline-text {
        min-height: 36px;
        margin-top: 4px;
        font-family: inherit;
      }
    </style>
  </head>

    <div id="app"></div>
