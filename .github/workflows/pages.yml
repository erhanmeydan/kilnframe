# Publishes site/ (kilnframe.com) to GitHub Pages whenever it changes on main, and when a release is published
# (the changelog pages carry the release notes as plain HTML, written by scripts/site-changelog.mjs).
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site-changelog.mjs", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Release notes into the changelog pages
        run: node scripts/site-changelog.mjs site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
