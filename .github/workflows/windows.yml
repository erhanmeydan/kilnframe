# Builds the Windows installer (Kilnframe-Windows.exe) on GitHub's Windows machine. The Mac installer is
# built, signed and notarized on the maintainer's Mac (packages/app/scripts/stage.mjs --pkg).
# Run by hand (Actions > Windows > Run workflow); the installer is attached to the run as an artifact.
# Unsigned for now: Windows shows SmartScreen's "More info, Run anyway".
name: Windows

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: "Plugin id (kilnframe, or kilnframe-test beside a development plugin)"
        default: "kilnframe"
        required: true
      appx:
        description: "Test build: a Microsoft Store (MSIX) package signed with a throwaway certificate, no tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # the headless Chrome HyperFrames pins (its CHROME_VERSION), into HyperFrames' own cache, where the
      # installer build takes it from
      - name: Headless Chrome
        shell: bash
        run: |
          v=$(node -e 'import("./scripts/deps/pins.mjs").then(m=>console.log(m.hyperframesChrome(process.cwd())))')
          npx --yes @puppeteer/browsers@3.2.3 install chrome-headless-shell@$v --path "$HOME/.cache/hyperframes/chrome"

      # the tests import the workspace packages' built output
      - run: pnpm -r build

      # the same pinned FFmpeg the app ships (packages/app/scripts/ffmpeg.mjs), for the tests that render sound
      - name: FFmpeg
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          node -e "import('./packages/app/scripts/ffmpeg.mjs').then((m) => m.fetchFfmpeg('win', 'x64', process.argv[1]))" "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"

      # a failing test stops the build: the installer is made only from code that passes on Windows
      - run: pnpm test
        if: ${{ !inputs.appx }}

      - name: Build the installer
        if: ${{ !inputs.appx }}
        run: node packages/app/scripts/stage.mjs --plugin-id ${{ inputs.plugin_id }}
        env:
          # no code signing certificate yet
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # a certificate made for this run only: the tester trusts its .cer once (Trusted People) to install the package
      - name: Build the MSIX package
        if: ${{ inputs.appx }}
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Kilnframe Test" -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "kilnframe-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.pfx" -Password $pw | Out-Null
          New-Item -ItemType Directory -Force out\app-build | Out-Null
          Export-Certificate -Cert $cert -FilePath out\app-build\Kilnframe-Test.cer | Out-Null
          $env:CSC_LINK = "$env:RUNNER_TEMP\test.pfx"
          $env:CSC_KEY_PASSWORD = "kilnframe-test"
          node packages/app/scripts/stage.mjs --plugin-id ${{ inputs.plugin_id }} --appx

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.appx }}
        with:
          name: Kilnframe-Windows-MSIX
          path: |
            out/app-build/Kilnframe-Windows.appx
            out/app-build/Kilnframe-Test.cer
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.appx }}
        with:
          name: Kilnframe-Windows
          path: |
            out/app-build/Kilnframe-Windows.exe
            out/app-build/Kilnframe-Windows.exe.blockmap
            out/app-build/latest.yml
          if-no-files-found: error
