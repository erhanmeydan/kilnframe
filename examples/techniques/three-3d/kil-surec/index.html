<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>kil-lacivert, three-3d, süreç</title>
    <script src="vendor/gsap/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 800;
        src: url("vendor/fonts/barlow-condensed/BarlowCondensed-ExtraBold.ttf") format("truetype");
      }
      html,
      body {
        margin: 0;
        background: #262b55;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #262b55;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #gl,
      #grain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 96% 4%,
          rgba(242, 165, 65, 0.22) 0%,
          rgba(242, 165, 65, 0) 38%
        );
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 75% 70% at 58% 46%,
          rgba(18, 21, 46, 0) 55%,
          rgba(18, 21, 46, 0.55) 100%
        );
      }
      #headline {
        position: absolute;
        left: 120px;
        top: 360px;
        width: 520px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 122px;
        line-height: 1.08;
        color: #ecdcc0;
        text-transform: uppercase;
        text-shadow: 0 8px 28px rgba(18, 21, 46, 0.6);
      }
      .hl-word {
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="kil-surec"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <section id="stage" class="clip" data-start="0" data-duration="5">
        <canvas id="gl" width="1920" height="1080"></canvas>
        <div id="glow"></div>
        <div id="vignette"></div>
        <canvas id="grain" width="1920" height="1080"></canvas>
        <div id="headline">
          <span class="hl-word">Üç</span>
          <span class="hl-word">adımda</span>
        </div>
      </section>
    </div>

    <script type="module">
      import * as THREE from "three";

      // ---------- style tokens (styles/kil-lacivert/tokens.json) ----------
      const PAL = {
        navy: "#353C72",
        navyD: "#262B55",
        navyDD: "#12152E",
        cream: "#ECDCC0",
        amber: "#F2A541",
        mustard: "#C99333",
      };
      const W = 1920;
      const H = 1080;
      const DURATION = 5;
      const FPS = 30000 / 1001;

      // ---------- helpers ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      const easeOut = (p) => 1 - Math.pow(1 - p, 3);

      function mulberry(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // Drop from height h, then one squash bounce (tokens.motion.drop).
      function drop(t, t0, h = 1.6, fall = 0.42) {
        if (t < t0) return { y: h, sy: 1, on: false };
        const p = (t - t0) / fall;
        if (p < 1) return { y: h * (1 - p * p), sy: 1 + 0.08 * p, on: true };
        const q = t - t0 - fall;
        return {
          y: 0,
          sy: 1 - 0.17 * Math.exp(-7 * q) * Math.cos(Math.PI * 2 * 1.25 * q),
          on: true,
        };
      }
      function applyDrop(obj, baseX, d) {
        obj.visible = d.on;
        obj.position.set(baseX, d.y, 0);
        const sxz = 1 / Math.sqrt(d.sy);
        obj.scale.set(sxz, d.sy, sxz);
      }

      // ---------- procedural clay surface (seeded, no image files) ----------
      function clayBumpTexture(seed) {
        const size = 512;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const g = c.getContext("2d");
        const rnd = mulberry(seed);
        g.fillStyle = "rgb(128,128,128)";
        g.fillRect(0, 0, size, size);
        // soft bumps
        for (let i = 0; i < 260; i++) {
          const x = rnd() * size;
          const y = rnd() * size;
          const r = 6 + rnd() * 26;
          const v = 128 + (rnd() - 0.5) * 34;
          const grad = g.createRadialGradient(x, y, 0, x, y, r);
          grad.addColorStop(0, `rgba(${v},${v},${v},0.55)`);
          grad.addColorStop(1, `rgba(${v},${v},${v},0)`);
          g.fillStyle = grad;
          g.fillRect(x - r, y - r, r * 2, r * 2);
        }
        // fingerprint swirls: groups of concentric arcs
        g.lineWidth = 2.6;
        for (let i = 0; i < 9; i++) {
          const cx = rnd() * size;
          const cy = rnd() * size;
          const a0 = rnd() * Math.PI * 2;
          const span = 0.9 + rnd() * 1.6;
          for (let k = 0; k < 14; k++) {
            const r = 8 + k * 6;
            g.strokeStyle = `rgba(${k % 2 ? 150 : 106},${k % 2 ? 150 : 106},${k % 2 ? 150 : 106},0.35)`;
            g.beginPath();
            g.arc(cx, cy, r, a0, a0 + span);
            g.stroke();
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.colorSpace = THREE.NoColorSpace;
        return tex;
      }

      const bump = clayBumpTexture(11);
      bump.repeat.set(0.22, 0.22);
      const matCache = {};
      function clay(hex) {
        if (!matCache[hex]) {
          matCache[hex] = new THREE.MeshStandardMaterial({
            color: hex,
            roughness: 0.92,
            metalness: 0,
            bumpMap: bump,
            bumpScale: 0.45,
          });
        }
        return matCache[hex];
      }

      // Extrude a 2D shape into a soft clay slab standing on y = 0, centered on x.
      function claySlab(shape, depth, hex, bevel = 0.09, anchor = true) {
        const geo = new THREE.ExtrudeGeometry(shape, {
          depth,
          bevelEnabled: true,
          bevelThickness: bevel,
          bevelSize: bevel,
          bevelSegments: 5,
          curveSegments: 24,
        });
        geo.computeBoundingBox();
        const bb = geo.boundingBox;
        if (anchor)
          geo.translate(-(bb.min.x + bb.max.x) / 2, -bb.min.y, -(bb.min.z + bb.max.z) / 2);
        const mesh = new THREE.Mesh(geo, clay(hex));
        mesh.castShadow = mesh.receiveShadow = true;
        return mesh;
      }

      function roundedRectShape(w, h, r) {
        const s = new THREE.Shape();
        const x = -w / 2;
        const y = -h / 2;
        s.moveTo(x + r, y);
        s.lineTo(x + w - r, y);
        s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + h - r);
        s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        s.lineTo(x + r, y + h);
        s.quadraticCurveTo(x, y + h, x, y + h - r);
        s.lineTo(x, y + r);
        s.quadraticCurveTo(x, y, x + r, y);
        return s;
      }

      // ---------- renderer, scene, camera ----------
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(PAL.navyD);
      scene.fog = new THREE.Fog(PAL.navyD, 14, 30);

      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);

      // floor
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.MeshStandardMaterial({ color: "#2E3468", roughness: 1, metalness: 0 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // lights (tokens.lights)
      const key = new THREE.SpotLight("#FFD29A", 150, 34, 0.6, 0.6, 1.5);
      key.position.set(7, 9, 7);
      key.target.position.set(0.7, 0.6, 0);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.bias = -0.0004;
      key.shadow.radius = 6;
      scene.add(key, key.target);
      scene.add(new THREE.HemisphereLight("#B7C3FF", "#3A2A1A", 0.95));
      const rim = new THREE.DirectionalLight("#9AA6FF", 0.55);
      rim.position.set(-6, 4, -6);
      scene.add(rim);

      // ---------- objects ----------
      const X = { doc: -1.95, gear: 0.7, play: 3.35 };

      // document: rectangle with the top right corner cut, plus a folded flap
      const docW = 1.3;
      const docH = 1.7;
      const fold = 0.42;
      const docShape = new THREE.Shape();
      docShape.moveTo(-docW / 2, -docH / 2);
      docShape.lineTo(docW / 2, -docH / 2);
      docShape.lineTo(docW / 2, docH / 2 - fold);
      docShape.lineTo(docW / 2 - fold, docH / 2);
      docShape.lineTo(-docW / 2, docH / 2);
      docShape.closePath();
      const doc = new THREE.Group();
      const docBody = claySlab(docShape, 0.22, PAL.cream);
      doc.add(docBody);
      const flapShape = new THREE.Shape();
      const fx = docW / 2 - fold;
      const fy = docH - fold;
      flapShape.moveTo(fx + 0.02, fy + 0.02);
      flapShape.lineTo(fx + fold - 0.03, fy + 0.02);
      flapShape.lineTo(fx + 0.02, fy + fold - 0.03);
      flapShape.closePath();
      const flap = claySlab(flapShape, 0.05, "#D9C5A2", 0.035, false);
      flap.position.z = 0.24;
      doc.add(flap);
      scene.add(doc);

      // gear: 8 teeth with a center hole
      function gearShape(rOuter, rInner, teeth, holeR) {
        const s = new THREE.Shape();
        const steps = 360;
        const mid = (rOuter + rInner) / 2;
        const amp = (rOuter - rInner) / 2;
        const k = 3.2;
        for (let i = 0; i <= steps; i++) {
          const a = (i / steps) * Math.PI * 2;
          const r = mid + (amp * Math.tanh(k * Math.cos(teeth * a))) / Math.tanh(k);
          const x = Math.cos(a) * r;
          const y = Math.sin(a) * r;
          if (i === 0) s.moveTo(x, y);
          else s.lineTo(x, y);
        }
        const hole = new THREE.Path();
        hole.absarc(0, 0, holeR, 0, Math.PI * 2, true);
        s.holes.push(hole);
        return s;
      }
      const gear = new THREE.Group();
      const gearMesh = claySlab(gearShape(0.8, 0.6, 8, 0.24), 0.3, PAL.mustard, 0.08);
      gearMesh.geometry.center();
      gearMesh.position.y = 0.92;
      gear.add(gearMesh);
      scene.add(gear);

      // play button: rounded square with an amber triangle on its face
      const play = new THREE.Group();
      play.add(claySlab(roundedRectShape(1.55, 1.4, 0.36), 0.3, PAL.cream));
      const tri = new THREE.Shape();
      tri.moveTo(-0.22, -0.3);
      tri.lineTo(0.34, 0);
      tri.lineTo(-0.22, 0.3);
      tri.closePath();
      const triMesh = claySlab(tri, 0.08, PAL.amber, 0.05);
      triMesh.position.set(0.05, 0.42, 0.26);
      play.add(triMesh);
      scene.add(play);

      // arrows: tail at origin so scale.x grows them from the tail
      function arrowMesh(len) {
        const s = new THREE.Shape();
        const t = 0.085;
        const head = 0.26;
        s.moveTo(0, -t);
        s.lineTo(len - head, -t);
        s.lineTo(len - head, -t - 0.12);
        s.lineTo(len, 0);
        s.lineTo(len - head, t + 0.12);
        s.lineTo(len - head, t);
        s.lineTo(0, t);
        s.closePath();
        const geo = new THREE.ExtrudeGeometry(s, {
          depth: 0.12,
          bevelEnabled: true,
          bevelThickness: 0.05,
          bevelSize: 0.05,
          bevelSegments: 4,
        });
        const m = new THREE.Mesh(geo, clay(PAL.amber));
        m.castShadow = true;
        return m;
      }
      const arrow1 = arrowMesh(0.82);
      arrow1.position.set(X.doc + 0.8, 0.82, 0);
      const arrow2 = arrowMesh(0.72);
      arrow2.position.set(X.gear + 0.95, 0.82, 0);
      scene.add(arrow1, arrow2);

      // accent burst around the play button (short amber clay strokes)
      const burst = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const a = Math.PI * (0.18 + i * 0.16);
        const stroke = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.045, 0.22, 6, 12),
          clay(PAL.amber),
        );
        stroke.position.set(Math.cos(a) * 1.15, 0.72 + Math.sin(a) * 1.05, 0.1);
        stroke.rotation.z = a - Math.PI / 2;
        stroke.castShadow = true;
        burst.add(stroke);
      }
      burst.position.x = X.play;
      scene.add(burst);

      // ---------- film grain (tokens.post.grain) ----------
      const grainCanvas = document.getElementById("grain");
      const gctx = grainCanvas.getContext("2d");
      const tile = document.createElement("canvas");
      tile.width = tile.height = 256;
      {
        const tctx = tile.getContext("2d");
        const img = tctx.createImageData(256, 256);
        const rnd = mulberry(7);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = rnd() < 0.5 ? 0 : 255;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = Math.floor(rnd() * 33);
        }
        tctx.putImageData(img, 0, 0);
      }
      const grainPattern = gctx.createPattern(tile, "repeat");
      function drawGrain(t) {
        const rnd = mulberry(1000 + Math.round(t * FPS));
        gctx.clearRect(0, 0, W, H);
        gctx.save();
        gctx.translate(-Math.floor(rnd() * 256), -Math.floor(rnd() * 256));
        gctx.fillStyle = grainPattern;
        gctx.fillRect(0, 0, W + 256, H + 256);
        gctx.restore();
      }

      // ---------- frame from time ----------
      const T = { doc: 0.35, arrow1: [1.0, 1.35], gear: 1.15, arrow2: [1.85, 2.2], play: 2.05 };

      function renderAt(t) {
        applyDrop(doc, X.doc, drop(t, T.doc));
        applyDrop(gear, X.gear, drop(t, T.gear));
        applyDrop(play, X.play, drop(t, T.play));

        // gear starts turning after it settles
        gearMesh.rotation.z = -easeInOut(seg(t, T.gear + 0.6, DURATION)) * 1.4;

        const a1 = easeOut(seg(t, ...T.arrow1));
        arrow1.visible = a1 > 0.001;
        arrow1.scale.set(Math.max(a1, 0.001), 1, 1);
        const a2 = easeOut(seg(t, ...T.arrow2));
        arrow2.visible = a2 > 0.001;
        arrow2.scale.set(Math.max(a2, 0.001), 1, 1);

        // burst pops when the play button lands, then shrinks away
        const landed = T.play + 0.42;
        const pop = seg(t, landed, landed + 0.12);
        const fade = seg(t, landed + 0.45, landed + 0.75);
        const bs = easeOut(pop) * (1 - easeOut(fade));
        burst.visible = bs > 0.001;
        burst.children.forEach((s) => s.scale.setScalar(Math.max(bs, 0.001)));

        // slow push in, never shakes
        const push = easeInOut(seg(t, 0, DURATION));
        camera.position.set(-1.3 + 0.15 * push, 2.7 - 0.15 * push, 13.4 - 0.8 * push);
        camera.lookAt(-1.3 + 0.15 * push, 0.95, 0);

        renderer.render(scene, camera);
        drawGrain(t);
      }

      // ---------- timeline ----------
      // The 3D frame is drawn from a linear tween's setter, so every seek repaints the exact time.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["kil-surec"] = document.fonts
        .load('800 122px "Barlow Condensed"')
        .then(() => {
          const driver = { _t: -1 };
          Object.defineProperty(driver, "t", {
            get() {
              return this._t;
            },
            set(v) {
              if (v === this._t) return;
              this._t = v;
              renderAt(v);
            },
          });
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(driver, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none" }, 0);
          tl.fromTo(
            ".hl-word",
            { y: 46, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.42, ease: "power3.out", stagger: 0.07 },
            0.2,
          );
          renderAt(0);
          window.__timelines["kil-surec"] = tl;
          return true;
        });
    </script>
  </body>
</html>
