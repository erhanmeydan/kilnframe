          tl.set(mMark2, { opacity: 1 }, 7.0);
          tl.fromTo(mv, { x: 0 }, { x: STEP, duration: 0.75, ease: "power2.inOut" }, 7.0);

          const lbl = el("text", { class: "s1-mono", x: MX + STEP / 2, y: 322, "text-anchor": "middle" });
          const lblChars = [];
          for (const ch of "YILDA BİRKAÇ CM".trim()) {
            const ts = el("tspan", { "fill-opacity": 0 }, lbl);
            ts.textContent = ch;
            if (ch !== " ") lblChars.push(ts);
          }
          lblChars.forEach((ts, i) => tl.set(ts, { attr: { "fill-opacity": 1 } }, 7.52 + i * 0.04));

          // ---------- 9. camera: precise pan right along the center line ----------
          const cam = { _x: 1 };
          Object.defineProperty(cam, "x", {
            get() { return this._x; },
            set(v) {
              if (v === this._x) return;
              this._x = v;
              world.setAttribute("transform", `translate(${v.toFixed(2)} 0)`);
            },
          });
          cam.x = 0;
          tl.fromTo(cam, { x: 0 }, { x: -STEP, duration: 1.7, ease: "power2.inOut" }, 7.05);
        }
      </script>
    </template>
  </body>
</html>
