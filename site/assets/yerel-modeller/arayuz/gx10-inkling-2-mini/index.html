<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaman Çizelgesi Düzenleyici</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:#0d0f13; color:#e8ebf2;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .app{height:100vh; display:grid; grid-template-rows:372px minmax(0,1fr) 64px; gap:10px; padding:12px;}
  .panel{
    background:linear-gradient(180deg,#181c24,#141821);
    border:1px solid #272e3b; border-radius:14px; min-height:0;
    box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .panel-title{
    display:flex; align-items:center; gap:9px; padding:12px 14px 10px;
    color:#c7cedb; font-size:13px; font-weight:800; letter-spacing:.06em;
    border-bottom:1px solid rgba(255,255,255,.055);
  }
  .panel-title .meta{margin-left:auto; color:#7f899b; font-size:11px; font-weight:600; letter-spacing:.04em}
  .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .dot-blue{background:#4f8cff;color:#4f8cff}.dot-green{background:#34d399;color:#34d399}.dot-purple{background:#a78bfa;color:#a78bfa}

  .top{display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:10px; min-height:0;}
  .preview-panel{display:flex; flex-direction:column; overflow:hidden;}
  .stage{
    position:relative; flex:1; margin:12px; border-radius:12px; overflow:hidden;
    background-color:#3b82f6; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), inset 0 -40px 80px rgba(0,0,0,.18);
  }
  .stage::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.16), transparent 55%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 14px, transparent 14px 28px),
      linear-gradient(180deg, rgba(255,255,255,.10), transparent 38%, rgba(0,0,0,.32));
  }
  .stage-name{
    position:relative; z-index:2; max-width:92%; text-align:center; color:#fff;
    font-size:58px; line-height:1.02; font-weight:850; letter-spacing:-.025em;
    text-shadow:0 4px 18px rgba(0,0,0,.45); padding:0 24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .stage-tc{
    position:absolute; z-index:2; left:16px; bottom:14px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:15px; color:rgba(255,255,255,.95); background:rgba(0,0,0,.30); border:1px solid rgba(255,255,255,.20);
    padding:6px 9px; border-radius:8px; letter-spacing:.03em;
  }

  .inspector-panel{display:flex; flex-direction:column; overflow:hidden;}
  .inspector-body{flex:1; min-height:0; padding:14px 16px; display:flex; flex-direction:column; justify-content:space-evenly; gap:10px;}
  .insp-name{display:flex; align-items:center; gap:11px; font-size:22px; line-height:1.15; font-weight:850; color:#fff; min-width:0; padding-bottom:4px; border-bottom:1px solid rgba(255,255,255,.07);}
  .chip{flex:0 0 auto; width:17px; height:17px; border-radius:5px; box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 8px rgba(0,0,0,.4)}
  .insp-name span:last-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .rows{display:grid; gap:9px;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 12px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.06); border-radius:9px;}
  .row .k{color:#a3adc0; font-size:12px; letter-spacing:.03em; white-space:nowrap}
  .row .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:#f3f6fb; font-size:13px; white-space:nowrap; display:flex; align-items:center; gap:8px}
  .swatch{display:inline-block; width:12px; height:12px; border-radius:4px; box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 4px rgba(0,0,0,.5)}

  .timeline-panel{display:flex; flex-direction:column; overflow:hidden; user-select:none;}
  .tl-body{position:relative; flex:1; min-height:0; display:flex;}
  .tl-inner{position:relative; flex:1; min-width:0; display:flex; flex-direction:column; padding-right:14px;}
  .ruler-row{display:grid; grid-template-columns:150px minmax(0,1fr); height:38px; border-bottom:1px solid #262d39; flex:0 0 auto;}
  .corner{border-right:1px solid #262d39; background:#151922; display:flex; align-items:center; padding:0 12px; color:#7f899b; font-size:11px; letter-spacing:.08em;}
  .ruler{position:relative; overflow:hidden; cursor:pointer; background:linear-gradient(180deg,#1a1f29,#151923); transition:background .15s ease;}
  .ruler:hover{background:linear-gradient(180deg,#1e2430,#181d27);}
  .tick{position:absolute; bottom:0; width:1px; height:8px; background:#3d4657; pointer-events:none}
  .tick.major{height:12px; background:#4c566b}
  .rlabel{position:absolute; top:6px; transform:translateX(-50%); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; color:#aeb7c8; white-space:nowrap; pointer-events:none}
  .rlabel.first{transform:translateX(12px)}
  .tracks{flex:1; min-height:0; display:flex; flex-direction:column;}
  .track-row{display:grid; grid-template-columns:150px minmax(0,1fr); flex:1 1 0; min-height:0; border-bottom:1px solid #232a35;}
  .track-row:last-child{border-bottom:none}
  .track-head{position:relative; border-right:1px solid #262d39; background:#151922; display:flex; align-items:center; gap:10px; padding:0 12px; min-width:0;}
  .track-row[data-track="V1"] .track-head::before,
  .track-row[data-track="V2"] .track-head::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:#4f8cff}
  .track-row[data-track="A1"] .track-head::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:#34d399}
  .tid{font-weight:850; font-size:15px; color:#fff; width:28px; flex:0 0 auto}
  .tname{color:#a7b0c2; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .lane{position:relative; background:linear-gradient(180deg,#12161d,#10141a);}
  .grid{position:absolute; inset:0; pointer-events:none; z-index:0}
  .gridline{position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.045)}
  .gridline.major{background:rgba(255,255,255,.09)}
  .clip{
    position:absolute; top:9px; bottom:9px; border-radius:8px; z-index:2; cursor:pointer; overflow:hidden;
    display:flex; flex-direction:column; min-width:3px;
    border:1px solid rgba(255,255,255,.20);
    box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22);
    transition:filter .12s ease;
  }
  .clip::before{content:""; position:absolute; inset:0; z-index:0; pointer-events:none; background:linear-gradient(180deg,rgba(255,255,255,.20),transparent 45%,rgba(0,0,0,.16))}
  .clip > *{position:relative; z-index:1}
  .clip:hover{filter:brightness(1.08)}
  .clip:focus-visible{outline:2px solid #fff; outline-offset:1px}
  .clip.selected{outline:2px solid #fff; outline-offset:1px; box-shadow:0 0 0 4px rgba(255,255,255,.14), 0 10px 22px rgba(0,0,0,.45); z-index:4}
  .clip-label{flex:1; display:flex; align-items:center; justify-content:center; padding:6px 8px; font-size:12px; font-weight:750; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .audio-clip{justify-content:flex-start}
  .audio-clip .clip-label{flex:0 0 auto; justify-content:flex-start; padding:5px 8px 3px; font-size:11px; opacity:.96}
  canvas.wave{flex:1; width:100%; min-height:0; display:block; margin:0 4px 4px; border-radius:5px; background:rgba(0,0,0,.20)}

  .lane-area{position:absolute; left:150px; right:14px; top:0; bottom:0; pointer-events:none; z-index:10}
  .playhead{position:absolute; top:0; bottom:0; width:2px; transform:translateX(-50%); background:#ff5c6c; box-shadow:0 0 9px rgba(255,92,108,.75)}
  .playhead::before{content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:12px; height:14px; background:#ff5c6c; clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}

  .transport{display:flex; align-items:center; gap:18px; padding:0 16px; user-select:none;}
  .t-group{display:flex; align-items:baseline; gap:10px; min-width:0}
  .t-label{color:#8f99ac; font-size:11px; letter-spacing:.08em; white-space:nowrap}
  .tc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:750; color:#f5f7fb; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); padding:8px 10px; border-radius:9px; white-space:nowrap}
  .big{font-size:18px; letter-spacing:.02em}
  .btn{margin-left:auto; height:40px; padding:0 16px; border-radius:10px; border:1px solid rgba(255,255,255,.16); background:linear-gradient(180deg,#3b82f6,#2563eb); color:#fff; font-weight:800; letter-spacing:.02em; cursor:pointer; box-shadow:0 8px 18px rgba(37,99,235,.35), inset 0 1px 0 rgba(255,255,255,.25)}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px); filter:brightness(.96)}
  .btn:focus-visible{outline:2px solid #fff; outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <section class="panel preview-panel" data-test="preview" aria-label="Önizleme">
      <div class="panel-title"><span class="dot dot-blue"></span>Önizleme</div>
      <div class="stage" id="stage">
        <div class="stage-name" id="previewName">Giriş</div>
        <div class="stage-tc" id="previewTc">00:00:00:00</div>
      </div>
    </section>

    <aside class="panel inspector-panel" data-test="inspector" aria-label="Klip bilgisi">
      <div class="panel-title"><span class="dot dot-green"></span>Klip bilgisi</div>
      <div class="inspector-body">
        <div class="insp-name"><span class="chip" id="insDot"></span><span id="insName">Giriş</span></div>
        <div class="rows">
          <div class="row"><span class="k">Şerit</span><span class="v" id="insTrack">V1 · Video 1</span></div>
          <div class="row"><span class="k">Giriş noktası</span><span class="v" id="insIn">00:00:00:00</span></div>
          <div class="row"><span class="k">Çıkış noktası</span><span class="v" id="insOut">00:00:05:00</span></div>
          <div class="row"><span class="k">Süre</span><span class="v" id="insDur">00:00:05:00</span></div>
          <div class="row"><span class="k">Renk</span><span class="v"><span class="swatch" id="insSwatch"></span><span id="insHex">#3b82f6</span></span></div>
        </div>
      </div>
    </aside>
  </div>

  <section class="panel timeline-panel" aria-label="Zaman çizelgesi">
    <div class="panel-title"><span class="dot dot-purple"></span>Zaman çizelgesi<span class="meta">25 kare/sn · HH:MM:SS:FF</span></div>
    <div class="tl-body" id="tlBody">
      <div class="tl-inner">
        <div class="ruler-row">
          <div class="corner">Şerit</div>
          <div class="ruler" data-test="ruler" id="ruler"></div>
        </div>
        <div class="tracks" id="tracks">
          <div class="track-row" data-track="V1">
            <div class="track-head"><span class="tid">V1</span><span class="tname">Video 1</span></div>
            <div class="lane" id="lane-V1"></div>
          </div>
          <div class="track-row" data-track="V2">
            <div class="track-head"><span class="tid">V2</span><span class="tname">Video 2</span></div>
            <div class="lane" id="lane-V2"></div>
          </div>
          <div class="track-row" data-track="A1">
            <div class="track-head"><span class="tid">A1</span><span class="tname">Müzik</span></div>
            <div class="lane" id="lane-A1"></div>
          </div>
        </div>
        <div class="lane-area"><div class="playhead" id="playhead"></div></div>
      </div>
    </div>
  </section>

  <footer class="panel transport" aria-label="Taşıma çubuğu">
    <div class="t-group"><span class="t-label">Konum</span><span class="tc big" data-test="timecode" id="timecode">00:00:00:00</span></div>
    <div class="t-group"><span class="t-label">Toplam süre</span><span class="tc big" data-test="duration" id="duration">00:00:42:13</span></div>
    <button class="btn" data-test="close-gaps" id="closeGaps" type="button">Boşlukları kapat</button>
  </footer>
</div>

<script>
(function(){
  const FPS = 25;
  const tracks = [
    {id:'V1', name:'Video 1'},
    {id:'V2', name:'Video 2'},
    {id:'A1', name:'Müzik'}
  ];
  const clips = [
    {name:'Giriş', track:'V1', start:0, duration:125, color:'#3b82f6'},
    {name:'Röportaj', track:'V1', start:125, duration:450, color:'#8b5cf6'},
    {name:'B-roll Şehir', track:'V1', start:650, duration:200, color:'#14b8a6'},
    {name:'Kapanış', track:'V1', start:900, duration:163, color:'#f97316'},
    {name:'Logo', track:'V2', start:50, duration:100, color:'#eab308'},
    {name:'Alt yazı', track:'V2', start:300, duration:175, color:'#ec4899'},
    {name:'Müzik', track:'A1', start:0, duration:980, color:'#0ea5e9'}
  ];

  const state = { frame:0, selectedName:'Giriş' };
  const clipEls = {};
  const laneGrids = {};
  let tickCacheTotal = null;

  const stageEl = document.getElementById('stage');
  const previewName = document.getElementById('previewName');
  const previewTc = document.getElementById('previewTc');
  const insDot = document.getElementById('insDot');
  const insName = document.getElementById('insName');
  const insTrack = document.getElementById('insTrack');
  const insIn = document.getElementById('insIn');
  const insOut = document.getElementById('insOut');
  const insDur = document.getElementById('insDur');
  const insSwatch = document.getElementById('insSwatch');
  const insHex = document.getElementById('insHex');
  const rulerEl = document.getElementById('ruler');
  const playheadEl = document.getElementById('playhead');
  const timecodeEl = document.getElementById('timecode');
  const durationEl = document.getElementById('duration');

  function pad2(n){ return String(n).padStart(2,'0'); }
  function tc(frame){
    frame = Math.max(0, Math.floor(frame));
    const ff = frame % FPS;
    const totalSec = Math.floor(frame / FPS);
    const ss = totalSec % 60;
    const mm = Math.floor(totalSec / 60) % 60;
    const hh = Math.floor(totalSec / 3600);
    return pad2(hh)+':'+pad2(mm)+':'+pad2(ss)+':'+pad2(ff);
  }
  function totalDuration(){ return Math.max.apply(null, clips.map(c => c.start + c.duration)); }
  function trackById(id){ return tracks.find(t => t.id === id); }
  function contrastText(hex){
    const r = parseInt(hex.slice(1,3),16)/255;
    const g = parseInt(hex.slice(3,5),16)/255;
    const b = parseInt(hex.slice(5,7),16)/255;
    const lum = 0.2126*r + 0.7152*g + 0.0722*b;
    return lum > 0.62 ? '#111827' : '#ffffff';
  }

  function buildClips(){
    for(const track of tracks){
      const lane = document.getElementById('lane-'+track.id);
      const grid = document.createElement('div');
      grid.className = 'grid';
      lane.appendChild(grid);
      laneGrids[track.id] = grid;
    }
    for(const c of clips){
      const lane = document.getElementById('lane-'+c.track);
      const el = document.createElement('div');
      el.className = 'clip' + (c.track === 'A1' ? ' audio-clip' : '');
      el.dataset.clip = c.name;
      el.tabIndex = 0;
      el.setAttribute('role','button');
      el.style.backgroundColor = c.color;
      el.style.color = contrastText(c.color);

      const label = document.createElement('div');
      label.className = 'clip-label';
      label.textContent = c.name;
      el.appendChild(label);

      if(c.track === 'A1'){
        const canvas = document.createElement('canvas');
        canvas.className = 'wave';
        el.appendChild(canvas);
      }

      function select(){ state.selectedName = c.name; render(); }
      el.addEventListener('click', function(e){ e.stopPropagation(); select(); });
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select(); }
      });

      lane.appendChild(el);
      clipEls[c.name] = el;
    }
  }

  function ensureTicks(total){
    if(tickCacheTotal === total) return;
    tickCacheTotal = total;
    rulerEl.innerHTML = '';
    for(const track of tracks) laneGrids[track.id].innerHTML = '';

    const step = 100;
    for(let f=0; f<=total; f+=25){
      const p = (f/total*100) + '%';
      const major = (f % step === 0);
      for(const track of tracks){
        const line = document.createElement('div');
        line.className = 'gridline' + (major ? ' major' : '');
        line.style.left = p;
        laneGrids[track.id].appendChild(line);
      }
      if(major){
        const label = document.createElement('span');
        label.className = 'rlabel' + (f === 0 ? ' first' : '');
        label.textContent = tc(f);
        label.style.left = p;
        rulerEl.appendChild(label);

        const tick = document.createElement('div');
        tick.className = 'tick major';
        tick.style.left = p;
        rulerEl.appendChild(tick);
      } else {
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.style.left = p;
        rulerEl.appendChild(tick);
      }
    }
  }

  function previewUpdate(){
    const v1 = clips.filter(c => c.track === 'V1');
    const c = v1.find(c => state.frame >= c.start && state.frame < c.start + c.duration);
    if(c){
      stageEl.style.backgroundColor = c.color;
      previewName.textContent = c.name;
    } else {
      stageEl.style.backgroundColor = '#20242d';
      previewName.textContent = 'Boşluk';
    }
    previewTc.textContent = tc(state.frame);
  }

  function inspectorUpdate(){
    const c = clips.find(x => x.name === state.selectedName) || clips[0];
    insDot.style.background = c.color;
    insSwatch.style.background = c.color;
    insHex.textContent = c.color;
    insName.textContent = c.name;
    insTrack.textContent = c.track + ' · ' + trackById(c.track).name;
    insIn.textContent = tc(c.start);
    insOut.textContent = tc(c.start + c.duration);
    insDur.textContent = tc(c.duration);
  }

  function render(){
    const total = totalDuration();
    ensureTicks(total);

    for(const c of clips){
      const el = clipEls[c.name];
      el.style.left = (c.start / total * 100) + '%';
      el.style.width = Math.max(0, (c.duration / total * 100)) + '%';
      el.classList.toggle('selected', state.selectedName === c.name);
    }

    playheadEl.style.left = (state.frame / total * 100) + '%';
    timecodeEl.textContent = tc(state.frame);
    durationEl.textContent = tc(total);
    previewUpdate();
    inspectorUpdate();
  }

  function drawWave(){
    const music = clips.find(c => c.track === 'A1');
    const el = clipEls[music.name];
    if(!el) return;
    const canvas = el.querySelector('canvas');
    const w = Math.max(1, Math.floor(canvas.clientWidth));
    const h = Math.max(1, Math.floor(canvas.clientHeight));
    if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,w,h);

    const barCount = Math.max(24, Math.min(220, Math.round(music.duration / 5)));
    const gap = 1;
    const totalGaps = gap * (barCount - 1);
    const bw = Math.max(1, (w - totalGaps) / barCount);

    for(let i=0; i<barCount; i++){
      const v = 0.5 + 0.3 * Math.sin(i/9) + 0.15 * Math.sin(i/2.3);
      const bh = Math.max(1, Math.round(v * (h - 6)));
      const x = Math.floor(i * (bw + gap));
      const y = Math.floor((h - bh) / 2);
      ctx.fillStyle = 'rgba(224,242,254,' + (0.55 + v * 0.45).toFixed(3) + ')';
      ctx.fillRect(x, y, Math.max(1, Math.floor(bw)), bh);
    }
  }

  function setFrame(f){
    const total = totalDuration();
    state.frame = Math.max(0, Math.min(total, Math.round(f)));
    render();
  }

  function closeGaps(){
    const v1 = clips.filter(c => c.track === 'V1'); // preserves order
    let cursor = 0;
    for(const c of v1){
      c.start = cursor;
      cursor += c.duration;
    }
    state.frame = Math.min(state.frame, totalDuration());
    render();
    drawWave();
  }

  buildClips();
  render();
  drawWave();

  rulerEl.addEventListener('click', function(e){
    const rect = rulerEl.getBoundingClientRect();
    const p = (e.clientX - rect.left) / rect.width;
    setFrame(p * totalDuration());
  });

  document.getElementById('closeGaps').addEventListener('click', closeGaps);

  window.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      e.preventDefault();
      let d = e.key === 'ArrowRight' ? 1 : -1;
      if(e.shiftKey) d *= 25;
      setFrame(state.frame + d);
    } else if(e.key === 'Home'){
      e.preventDefault();
      setFrame(0);
    } else if(e.key === 'End'){
      e.preventDefault();
      setFrame(totalDuration());
    }
  });

  window.addEventListener('resize', drawWave);
})();
</script>
</body>
</html>
