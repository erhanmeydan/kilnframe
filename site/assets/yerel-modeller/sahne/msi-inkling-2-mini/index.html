<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mini Creator Studio — 3D Diorama</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e8eef3;
    font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .panel{position:absolute;top:18px;left:18px;padding:14px 16px 12px;border-radius:16px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 30px rgba(40,50,70,.18);border:1px solid rgba(255,255,255,.6);
    color:#2b3242;max-width:250px;transition:background .5s,color .5s,border-color .5s}
  body.night .panel{background:rgba(22,27,42,.62);border-color:rgba(255,255,255,.12);
    color:#e9edf5;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  h1{font-size:15px;margin:0 0 3px;letter-spacing:.02em;display:flex;align-items:center;gap:9px;font-weight:800}
  .recdot{width:9px;height:9px;border-radius:50%;background:#e5484d;box-shadow:0 0 8px #e5484d;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  .sub{margin:0 0 11px;font-size:10px;opacity:.62;letter-spacing:.14em;text-transform:uppercase}
  #lightBtn{display:block;width:100%;padding:9px 12px;border:none;border-radius:999px;background:#e5484d;color:#fff;
    font-weight:700;font-size:13px;letter-spacing:.04em;cursor:pointer;
    transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(229,72,77,.35)}
  #lightBtn:hover{transform:translateY(-1px) scale(1.02);box-shadow:0 6px 18px rgba(229,72,77,.45)}
  #lightBtn:active{transform:scale(.96)}
  #lightBtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .mode{margin-top:9px;font-size:11px;opacity:.78;text-align:center;letter-spacing:.08em;text-transform:uppercase}
  .hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);padding:7px 15px;border-radius:999px;
    background:rgba(255,255,255,.6);backdrop-filter:blur(8px);font-size:11px;letter-spacing:.07em;color:#3a4356;
    border:1px solid rgba(255,255,255,.5);white-space:nowrap;transition:background .5s,color .5s}
  body.night .hint{background:rgba(22,27,42,.55);color:#c9d2e4;border-color:rgba(255,255,255,.12)}
</style>
<script type="importmap">{"imports":{"three":"../../lib/three.module.js","three/addons/":"../../lib/addons/"}}</script>
</head>
<body>
<div id="app"></div>

<div class="panel">
  <h1><span class="recdot"></span>Mini Creator Studio</h1>
  <p class="sub">3D miniature diorama</p>
  <button id="lightBtn" type="button" aria-pressed="false">Işıklar</button>
  <div class="mode">Mod: <span id="modeLabel">Gündüz</span></div>
</div>
<div class="hint">Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============ renderer / scene / camera ============ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe8eef3, 22, 46);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(5.4, 3.7, 7.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, -0.55);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 4.2;
controls.maxDistance = 13;
controls.minPolarAngle = 0.5;
controls.maxPolarAngle = 1.42;           // never below the floor
controls.minAzimuthAngle = -0.38;        // stay in front of both walls
controls.maxAzimuthAngle = 1.15;
controls.rotateSpeed = 0.8;

/* ============ lighting presets ============ */
const PRESETS = {
  day:   { bg:new THREE.Color('#e8eef3'), ground:new THREE.Color('#d9cfc2'), sunC:new THREE.Color('#fff1dc'), fillC:new THREE.Color('#dfe9ff'),
           hemi:0.85, sun:1.75, fill:0.45, deskLamp:0.0, floorLamp:0.0, ringSpot:0.55, softbox:1.15, plaqueEm:0.12, ringEmissive:1.05, bulb:0.06, exposure:1.08 },
  night: { bg:new THREE.Color('#232a3d'), ground:new THREE.Color('#171c2b'), sunC:new THREE.Color('#8fa5d6'), fillC:new THREE.Color('#7f93c4'),
           hemi:0.22, sun:0.32, fill:0.12, deskLamp:2.9, floorLamp:3.1, ringSpot:2.05, softbox:2.6, plaqueEm:0.85, ringEmissive:2.5, bulb:2.4, exposure:1.02 }
};
let mode = 'day';
let target = PRESETS.day;
const cur = { hemi:PRESETS.day.hemi, sun:PRESETS.day.sun, fill:PRESETS.day.fill, deskLamp:0, floorLamp:0,
              ringSpot:PRESETS.day.ringSpot, softbox:PRESETS.day.softbox, plaqueEm:PRESETS.day.plaqueEm,
              ringEmissive:PRESETS.day.ringEmissive, bulb:PRESETS.day.bulb, exposure:PRESETS.day.exposure };

const bgColor = new THREE.Color('#e8eef3');
scene.background = bgColor;

/* ============ lights (world space) ============ */
const hemiLight = new THREE.HemisphereLight(0xcfe0f4, 0xd8c7b2, 0.85); scene.add(hemiLight);
const sun = new THREE.DirectionalLight('#fff1dc', 1.75);
sun.position.set(6, 8.5, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -7; sun.shadow.camera.right = 7;
sun.shadow.camera.top = 7;   sun.shadow.camera.bottom = -7;
sun.shadow.camera.near = 2;  sun.shadow.camera.far = 26;
sun.shadow.bias = -0.0004;   sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight('#dfe9ff', 0.45); fill.position.set(-6, 3.5, 6); scene.add(fill);

/* ============ helpers ============ */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial(Object.assign({ color, roughness:0.78, metalness:0.03 }, opts));
}
function RBox(w,h,d,r,color,opts={}) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,Math.min(r, Math.min(w,h,d)/2 - 0.001)), mat(color, opts));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function box(w,h,d,color,opts={}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color, opts));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function cyl(rt,rb,h,color,opts={},seg=20) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color, opts));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function strut(a, b, r, color, parent) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat(color, { roughness:0.55 }));
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  mesh.castShadow = true; parent.add(mesh); return mesh;
}
function roundedRectShape(w,h,r) {
  const s = new THREE.Shape(); const x=-w/2, y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
}

/* ============ canvas textures (all generated in code) ============ */
function makeFloorTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const f = c.getContext('2d');
  f.fillStyle = '#e3c79b'; f.fillRect(0,0,256,256);
  for (let y=0; y<256; y+=32) {
    const v = Math.sin(y*12.9898)*43758.5453; const r = v - Math.floor(v);
    f.fillStyle = `rgba(${r>0.5?255:120},${r>0.5?240:80},${r>0.5?210:40},${0.05+r*0.06})`;
    f.fillRect(0,y,256,32);
    f.fillStyle = 'rgba(120,80,40,0.28)'; f.fillRect(0,y,256,2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3,2.4);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function makePosterTexture() {
  const c = document.createElement('canvas'); c.width=256; c.height=320;
  const p = c.getContext('2d');
  const g = p.createLinearGradient(0,0,0,320);
  g.addColorStop(0,'#ffe3b3'); g.addColorStop(1,'#f6a56c');
  p.fillStyle=g; p.fillRect(0,0,256,320);
  p.beginPath(); p.arc(128,118,36,0,7); p.fillStyle='#fff3d6'; p.fill();
  p.fillStyle='#8a5a3b'; p.beginPath(); p.moveTo(-10,320); p.lineTo(95,168); p.lineTo(200,320); p.closePath(); p.fill();
  p.fillStyle='#5d4030'; p.beginPath(); p.moveTo(90,320); p.lineTo(185,190); p.lineTo(280,320); p.closePath(); p.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width=c.height=128;
  const p = c.getContext('2d');
  const g = p.createRadialGradient(64,64,4,64,64,62);
  g.addColorStop(0,'rgba(255,244,224,0.9)'); g.addColorStop(0.45,'rgba(255,236,200,0.35)'); g.addColorStop(1,'rgba(255,236,200,0)');
  p.fillStyle=g; p.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* ============ timeline screen texture ============ */
const tc = document.createElement('canvas'); tc.width = 512; tc.height = 288;
const tctx = tc.getContext('2d');
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
const clips = [
  {track:0, x:10,  w:120, c:'#e5484d'},{track:0, x:150, w:80,  c:'#f0a35e'},
  {track:0, x:250, w:140, c:'#7aa2ff'},{track:0, x:410, w:90,  c:'#5ec8c0'},
  {track:1, x:40,  w:100, c:'#f0a35e'},{track:1, x:160, w:150, c:'#3e7d74'},
  {track:1, x:330, w:110, c:'#e5484d'},{track:1, x:455, w:60,  c:'#5ec8c0'}
];
const screenTex = new THREE.CanvasTexture(tc);
screenTex.colorSpace = THREE.SRGBColorSpace;

function drawTimeline(t, recOn) {
  const W=512, H=288, headerW=64, trackX=headerW, trackW=W-headerW, S=512;
  tctx.fillStyle='#141922'; tctx.fillRect(0,0,W,H);
  // top bar
  tctx.fillStyle='#1d2430'; tctx.fillRect(0,0,W,34);
  ['#ff5f57','#febc2e','#28c840'].forEach((c,i)=>{ tctx.beginPath(); tctx.arc(20+i*18,17,4.5,0,7); tctx.fillStyle=c; tctx.fill(); });
  tctx.font='600 12px ui-monospace, monospace'; tctx.textAlign='left'; tctx.textBaseline='middle';
  tctx.fillStyle='#8fa0b5'; tctx.fillText('timeline_v3.mp4', 84, 18);
  if (recOn) {
    tctx.beginPath(); tctx.arc(448,17,5,0,7); tctx.fillStyle='#ff4444'; tctx.fill();
    tctx.fillStyle='#ffd9d9'; tctx.font='700 11px ui-monospace, monospace'; tctx.fillText('REC',460,18);
  }
  // ruler
  tctx.fillStyle='#1a212c'; tctx.fillRect(0,34,W,22);
  const tickOff = (t*55)%32;
  tctx.strokeStyle='rgba(255,255,255,0.10)'; tctx.lineWidth=1;
  for (let x=trackX-tickOff; x<W; x+=32){ tctx.beginPath(); tctx.moveTo(x,34); tctx.lineTo(x,56); tctx.stroke(); }
  // tracks bg + header col
  const rows=[{y:58,h:36,label:'V2'},{y:98,h:40,label:'V1'},{y:142,h:46,label:'A1'}];
  tctx.fillStyle='#171d27'; tctx.fillRect(0,58,W,H-58);
  rows.forEach(r=>{ tctx.strokeStyle='rgba(255,255,255,0.07)'; tctx.beginPath(); tctx.moveTo(0,r.y+r.h); tctx.lineTo(W,r.y+r.h); tctx.stroke(); });
  // scrolling video clips
  const off = (t*55)%S;
  for (const c of clips) {
    let x0 = ((c.x - off) % S + S) % S;
    for (const baseX of [trackX+x0, trackX+x0-S]) {
      const row = rows[c.track];
      const bx = Math.max(baseX, trackX), ex = Math.min(baseX + c.w, W);
      if (ex <= bx) continue;
      rr(tctx, bx+2, row.y+5, ex-bx-4, row.h-10, 6); tctx.fillStyle=c.c; tctx.fill();
      tctx.fillStyle='rgba(255,255,255,0.22)'; rr(tctx, bx+2, row.y+5, ex-bx-4, 7, 6); tctx.fill();
    }
  }
  // audio waveform (scrolls with same offset)
  const aRow = rows[2];
  for (let x=trackX; x<W; x+=5) {
    const wx = ((x - trackX + off) % S + S) % S;
    const h = 6 + 16*Math.abs(Math.sin(wx*0.09)+Math.sin(wx*0.023+1.7))/2;
    tctx.fillStyle='rgba(94,200,192,0.85)';
    tctx.fillRect(x, aRow.y + aRow.h/2 - h/2, 3, h);
  }
  // header col labels (drawn over tracks)
  tctx.fillStyle='#1a212c'; tctx.fillRect(0,58,headerW,H-58);
  rows.forEach(r=>{ tctx.fillStyle='#5d6b7f'; tctx.font='700 11px ui-monospace, monospace'; tctx.textAlign='center'; tctx.fillText(r.label, headerW/2, r.y+r.h/2); });
  // playhead
  const px = trackX + ((t*95) % trackW);
  tctx.save(); tctx.shadowColor='#ff5f57'; tctx.shadowBlur=8;
  tctx.strokeStyle='#ff5f57'; tctx.lineWidth=2.5;
  tctx.beginPath(); tctx.moveTo(px,34); tctx.lineTo(px,H-6); tctx.stroke(); tctx.restore();
  tctx.fillStyle='#ff5f57'; tctx.beginPath(); tctx.moveTo(px-7,36); tctx.lineTo(px+7,36); tctx.lineTo(px,48); tctx.closePath(); tctx.fill();
  // timecode
  const mm = String(Math.floor(t/60)%60).padStart(2,'0'), ss = String(Math.floor(t%60)).padStart(2,'0');
  tctx.fillStyle='#8fa0b5'; tctx.font='600 10px ui-monospace, monospace'; tctx.textAlign='right';
  tctx.fillText(`00:${mm}:${ss}`, W-10, H-12);
}

/* ============ diorama root (rotates as a whole) ============ */
const diorama = new THREE.Group(); scene.add(diorama);

// ground backdrop disc + fog blending
const groundMat = mat('#d9cfc2', { roughness:0.95 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), groundMat);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.53; ground.receiveShadow = true; scene.add(ground);

// plinth + floor plate
const plinth = RBox(9.6, 0.5, 7.6, 0.16, '#6f5138', { roughness:0.75 });
plinth.position.y = -0.27; diorama.add(plinth);
const floorPlate = new THREE.Mesh(new THREE.BoxGeometry(8.9, 0.12, 6.9), mat('#ffffff', { roughness:0.85 }));
floorPlate.material.map = makeFloorTexture();
floorPlate.position.y = -0.06; floorPlate.receiveShadow = true; diorama.add(floorPlate);

// walls + baseboards
const backWall = box(8.9, 4.7, 0.24, '#f0dcc4', { roughness:0.92 }); backWall.position.set(0, 2.35, -3.37); diorama.add(backWall);
const leftWall = box(0.24, 4.7, 6.9, '#cfdccf', { roughness:0.92 }); leftWall.position.set(-4.33, 2.35, 0); diorama.add(leftWall);
const bb1 = box(8.66, 0.26, 0.05, '#faf6ef'); bb1.position.set(0, 0.13, -3.235); diorama.add(bb1);
const bb2 = box(0.05, 0.26, 6.7, '#faf6ef'); bb2.position.set(-4.185, 0.13, 0); diorama.add(bb2);

// rug (layered circles)
const rug1 = new THREE.Mesh(new THREE.CircleGeometry(1.75, 40), mat('#d98a68', { roughness:0.95 }));
rug1.rotation.x = -Math.PI/2; rug1.position.set(-1.35, 0.012, -0.85); rug1.receiveShadow = true; diorama.add(rug1);
const rug2 = new THREE.Mesh(new THREE.CircleGeometry(1.12, 36), mat('#ecc39b', { roughness:0.95 }));
rug2.rotation.x = -Math.PI/2; rug2.position.set(-1.35, 0.02, -0.85); rug2.receiveShadow = true; diorama.add(rug2);
const rug3 = new THREE.Mesh(new THREE.CircleGeometry(0.45, 28), mat('#d98a68', { roughness:0.95 }));
rug3.rotation.x = -Math.PI/2; rug3.position.set(-1.35, 0.028, -0.85); rug3.receiveShadow = true; diorama.add(rug3);

/* ---- desk + monitor ---- */
const deskTop = RBox(4.3, 0.14, 1.55, 0.05, '#d9a066', { roughness:0.6 });
deskTop.position.set(-1.35, 1.12, -2.42); diorama.add(deskTop);
[[-3.30,-3.04],[0.60,-3.04],[-3.30,-1.80],[0.60,-1.80]].forEach(([x,z])=>{
  const leg = box(0.12, 1.05, 0.12, '#7c5233'); leg.position.set(x, 0.525, z); diorama.add(leg);
});

const monitorGroup = new THREE.Group(); monitorGroup.position.set(-1.35, 1.19, -2.55); diorama.add(monitorGroup);
const mBase = RBox(0.95, 0.06, 0.5, 0.025, '#23272e', { roughness:0.5 }); mBase.position.y = 0.03; monitorGroup.add(mBase);
const neck = box(0.16, 0.4, 0.1, '#23272e', { roughness:0.5 }); neck.position.set(0, 0.26, -0.02); monitorGroup.add(neck);
const screenGroup = new THREE.Group(); screenGroup.position.set(0, 1.02, -0.05); screenGroup.rotation.x = -0.06; monitorGroup.add(screenGroup);
const bezelGeo = new THREE.ExtrudeGeometry(roundedRectShape(2.6, 1.5, 0.16), { depth:0.10, bevelEnabled:false });
bezelGeo.translate(0, 0, -0.05);
const bezel = new THREE.Mesh(bezelGeo, mat('#23272e', { roughness:0.5, metalness:0.15 }));
bezel.castShadow = true; screenGroup.add(bezel);
const screenMat = new THREE.MeshBasicMaterial({ map:screenTex });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(2.38, 1.34), screenMat);
screen.position.z = 0.055; screenGroup.add(screen);

// keyboard / mouse / mug / books on desk
const keyboard = RBox(1.45, 0.07, 0.42, 0.03, '#f4efe6', { roughness:0.55 });
keyboard.position.set(-1.35, 1.235, -2.02); keyboard.rotation.y = 0.04; diorama.add(keyboard);
const mouse = RBox(0.22, 0.09, 0.34, 0.04, '#f4efe6', { roughness:0.55 });
mouse.position.set(-0.32, 1.235, -2.02); mouse.rotation.y = -0.15; diorama.add(mouse);

const mugGroup = new THREE.Group(); mugGroup.position.set(-2.9, 1.19, -1.95); diorama.add(mugGroup);
const mugBody = cyl(0.11, 0.10, 0.26, '#e5484d', { roughness:0.5 }); mugBody.position.y = 0.13; mugGroup.add(mugBody);
const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.085, 20), mat('#5b3a29', { roughness:0.4 }));
coffee.rotation.x = -Math.PI/2; coffee.position.y = 0.262; mugGroup.add(coffee);
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.02, 10, 20), mat('#e5484d', { roughness:0.5 }));
handle.rotation.y = Math.PI/2; handle.position.set(0.13, 0.14, 0); mugGroup.add(handle);

const book1 = box(0.55, 0.09, 0.40, '#7aa2ff'); book1.position.set(0.35, 1.235, -2.72); book1.rotation.y = 0.12; diorama.add(book1);
const book2 = box(0.48, 0.08, 0.36, '#f0a35e'); book2.position.set(0.33, 1.325, -2.70); book2.rotation.y = -0.06; diorama.add(book2);

/* ---- chair ---- */
const chairGroup = new THREE.Group(); chairGroup.position.set(-1.35, 0, -0.85); diorama.add(chairGroup);
const seatMat = mat('#3e7d74', { roughness:0.8 });
const darkMetal = mat('#2f333a', { roughness:0.45, metalness:0.35 });
const seat = new THREE.Mesh(new RoundedBoxGeometry(1.05, 0.18, 0.95, 3, 0.07), seatMat);
seat.position.y = 0.79; seat.castShadow = true; chairGroup.add(seat);
const backrest = new THREE.Mesh(new RoundedBoxGeometry(0.92, 1.02, 0.15, 3, 0.07), seatMat);
backrest.position.set(0, 1.38, 0.42); backrest.rotation.x = 0.12; backrest.castShadow = true; chairGroup.add(backrest);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 14), darkMetal);
pole.position.y = 0.45; pole.castShadow = true; chairGroup.add(pole);
const hub = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), darkMetal); hub.position.y = 0.2; chairGroup.add(hub);
for (let i=0;i<5;i++) {
  const a = i/5*Math.PI*2 + Math.PI/10;

});

/* ============ animation loop ============ */
const clock = new THREE.Clock();
let lastDraw = -1;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (autoRotate) diorama.rotation.y += dt * 0.14;

  // smooth lighting transition
  const k = 1 - Math.exp(-dt * 3.5);
  cur.hemi        += (target.hemi        - cur.hemi)        * k;
  cur.sun         += (target.sun         - cur.sun)         * k;
  cur.fill        += (target.fill        - cur.fill)        * k;
  cur.deskLamp    += (target.deskLamp    - cur.deskLamp)    * k;
  cur.floorLamp   += (target.floorLamp   - cur.floorLamp)   * k;
  cur.ringSpot    += (target.ringSpot    - cur.ringSpot)    * k;
  cur.softbox     += (target.softbox     - cur.softbox)     * k;
  cur.plaqueEm    += (target.plaqueEm    - cur.plaqueEm)    * k;
  cur.ringEmissive+= (target.ringEmissive- cur.ringEmissive)* k;
  cur.bulb        += (target.bulb        - cur.bulb)        * k;
  cur.exposure    += (target.exposure    - cur.exposure)    * k;

  bgColor.lerp(target.bg, k); scene.fog.color.copy(bgColor);
  groundMat.color.lerp(target.ground, k);
  sun.color.lerp(target.sunC, k); fill.color.lerp(target.fillC, k);

  hemiLight.intensity = cur.hemi;
  sun.intensity = cur.sun;
  fill.intensity = cur.fill;
  deskLampLight.intensity = cur.deskLamp;
  floorLampLight.intensity = cur.floorLamp;
  ringSpot.intensity = cur.ringSpot;
  softSpot.intensity = cur.softbox;

  plaqueMat.emissiveIntensity = cur.plaqueEm * (1 + 0.07*Math.sin(t*2.3));
  ringMat.emissiveIntensity = cur.ringEmissive * (1 + 0.06*Math.sin(t*3.1));
  softboxFrontMat.emissiveIntensity = cur.softbox * 0.62;
  bulbMat.emissiveIntensity = cur.bulb;
  lampShadeMat.emissiveIntensity = cur.bulb * 0.4;
  glowMat.opacity = Math.min(cur.ringEmissive * 0.3, 0.85);

  renderer.toneMappingExposure = cur.exposure;

  // recording light blink + timeline redraw (~30fps)
  const recOn = (t % 1.5) < 0.75;
  recMat.emissiveIntensity = recOn ? 3.4 : 0.15;
  recPoint.intensity = recOn ? 0.9 : 0.04;

  if (t - lastDraw > 1/30) { drawTimeline(t, recOn); screenTex.needsUpdate = true; lastDraw = t; }

  // clock hands drift
  minuteHand.rotation.z = -t * 0.15;
  hourHand.rotation.z   = -(1.5 + t * 0.02);

  controls.update();
  renderer.render(scene, camera);
}
